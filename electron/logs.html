<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>MyTime2Cloud — Logs</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: system-ui, "Segoe UI", sans-serif;
           background: #0b1220; color: #d7e1f0; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #1c2740; flex-wrap: wrap; }
    .bar label { font-size: 11px; color: #8aa0bd; text-transform: uppercase; letter-spacing: .04em; }
    select, input[type=text] { background: #111a2b; color: #e6edf6; border: 1px solid #243049; border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none; }
    input[type=text] { width: 200px; }
    select:focus, input:focus { border-color: #4f7cff; }
    button { background: #16324a; color: #cfe6ff; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    button.on { background: #4f7cff; color: #fff; }
    .spacer { flex: 1; }
    .count { font-size: 11px; color: #6b7c96; }
    #view { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; line-height: 1.5; }
    .ln { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
    .ts { color: #4a5870; flex: 0 0 auto; }
    .tag { flex: 0 0 130px; color: #7da2d9; font-weight: 700; }
    .msg { flex: 1; color: #c4d0e2; }
    .err .msg { color: #f87171; }
    .warn .msg { color: #fbbf24; }
    .ok .msg { color: #34d399; }
  </style>
</head>
<body>
  <div class="bar">
    <label>Service</label>
    <select id="svc"><option value="">all</option></select>
    <label>Search</label>
    <input type="text" id="q" placeholder="filter text…" />
    <button id="autoscroll" class="on">Auto-scroll</button>
    <button id="pause">Pause</button>
    <div class="spacer"></div>
    <span class="count" id="count"></span>
    <button id="clear">Clear</button>
  </div>
  <div id="view"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const view = $("view");
    let all = [];
    let paused = false;
    let autoscroll = true;
    const labels = new Set();

    function classify(line) {
      const s = line.toLowerCase();
      if (/(error|fail|exception|fatal|econnrefused|refused|denied|eaddrinuse|address already in use|emerg|bind\(|cannot bind|port.*in use)/.test(s)) return "err";
      if (/(warn|deprecat)/.test(s)) return "warn";
      if (/(connected|listening|ready|running|started|✓|done)/.test(s)) return "ok";
      return "";
    }
    function hhmmss(t) {
      const d = new Date(t);
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    function passes(e) {
      const svc = $("svc").value;
      const q = $("q").value.trim().toLowerCase();
      if (svc && e.label !== svc) return false;
      if (q && !(e.label + " " + e.line).toLowerCase().includes(q)) return false;
      return true;
    }
    function rowHtml(e) {
      const esc = (x) => x.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      return `<div class="ln ${classify(e.line)}"><span class="ts">${hhmmss(e.t)}</span><span class="tag">${esc(e.label)}</span><span class="msg">${esc(e.line)}</span></div>`;
    }
    function ensureLabel(label) {
      if (labels.has(label)) return;
      labels.add(label);
      const o = document.createElement("option");
      o.value = label; o.textContent = label;
      $("svc").appendChild(o);
    }
    function render() {
      const rows = all.filter(passes);
      view.innerHTML = rows.map(rowHtml).join("");
      $("count").textContent = `${rows.length} / ${all.length} lines`;
      if (autoscroll) view.scrollTop = view.scrollHeight;
    }
    function append(e) {
      all.push(e);
      ensureLabel(e.label);
      if (paused) return;
      if (passes(e)) {
        view.insertAdjacentHTML("beforeend", rowHtml(e));
        if (autoscroll) view.scrollTop = view.scrollHeight;
        $("count").textContent = `${view.childElementCount} / ${all.length} lines`;
      }
    }

    (async () => {
      all = await window.m2c.getLogs();
      all.forEach((e) => ensureLabel(e.label));
      render();
    })();

    window.m2c.onLogLine((e) => append(e));

    $("svc").addEventListener("change", render);
    $("q").addEventListener("input", render);
    $("autoscroll").addEventListener("click", () => { autoscroll = !autoscroll; $("autoscroll").classList.toggle("on", autoscroll); if (autoscroll) render(); });
    $("pause").addEventListener("click", () => { paused = !paused; $("pause").classList.toggle("on", paused); $("pause").textContent = paused ? "Resume" : "Pause"; if (!paused) render(); });
    $("clear").addEventListener("click", async () => { await window.m2c.clearLogs(); all = []; render(); });
  </script>
</body>
</html>
