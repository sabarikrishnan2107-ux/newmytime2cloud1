// ── Helpers ───────────────────────────────────────────────────
const PAL = ["#7c3aed","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899"];
const avatarBg = n => { let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%PAL.length; return PAL[Math.abs(h)]; };

function Avatar({ name, size=28 }) {
  const bg = avatarBg(name);
  return (
    <div style={{
      width:size,height:size,flexShrink:0,borderRadius:6,
      background:`${bg}28`,border:`1.5px solid ${bg}50`,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:Math.round(size*.4),fontWeight:700,color:bg
    }}>{name.charAt(0).toUpperCase()}</div>
  );
}

// ── Icon toggle cell ──────────────────────────────────────────
function IconCell({ enabled, iconOn, iconOff, colorOn, colorOff="#ef4444", size=16 }) {
  return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center"}}>
      <div style={{
        width:26,height:26,borderRadius:6,
        background:enabled?`${colorOn}18`:`${colorOff}18`,
        display:"flex",alignItems:"center",justifyContent:"center"
      }}>
        <Ic d={enabled?iconOn:iconOff} size={size} color={enabled?colorOn:colorOff} sw={1.8}/>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {Online:["#10b981","Online"],Offline:["#ef4444","Offline"],Warning:["#f59e0b","Warning"]};
  const [c,l] = map[status]||["#8b949e","—"];
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,
      fontSize:10.5,fontWeight:500,color:c,background:`${c}18`,
      padding:"3px 8px",borderRadius:20}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:c,display:"block"}}/>
      {l}
    </span>
  );
}

            fontSize:12.5,fontWeight:tab===t.key?600:400,
            color:tab===t.key?accent:"#8b949e",
            borderBottom:tab===t.key?`2px solid ${accent}`:"2px solid transparent",
            transition:"all .15s",whiteSpace:"nowrap"
          }}>
            <Ic d={t.icon} size={13} color={tab===t.key?accent:"#8b949e"} sw={2}/>
            {t.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:"auto",padding:"18px 24px",background:"#0d1117"}}>

        {tab==="info" && (
          <div style={{display:"flex",flexDirection:"column",gap:10,animation:"fadeIn .15s"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Field label="Device Name"    value={device.name}/>
              <Field label="Short Name"     value={device.shortName}/>
              <Field label="Serial Number"  value={device.serial}/>
              <Field label="Short Serial"   value={device.shortSerial}/>
              <Field label="Company"        value={device.company}/>
              <Field label="Branch"         value={device.branch}/>
              <Field label="Location"       value={device.location}/>
              <Field label="Sub-Location"   value={device.subLoc}/>
              <Field label="Function"       value={device.func==="fingerprint"?"Fingerprint":"Option"}/>
              <Field label="Type"           value={device.type==="biometric"?"Biometric":"Camera"}/>
              <Field label="Status"         value={<StatusBadge status={device.status}/>}/>
              <Field label="Device ID"      value={`DEV-${String(device.id).padStart(4,"0")}`}/>
            </div>
          </div>
        )}

        {tab==="settings" && (
          <div style={{display:"flex",flexDirection:"column",gap:8,animation:"fadeIn .15s"}}>
            <SettingRow label="Door Open Control"  enabled={device.doorOpen}  colorOn="#10b981"/>
            <SettingRow label="Door Close Control" enabled={device.doorClose} colorOn="#0ea5e9"/>
            <SettingRow label="Alarm Enabled"      enabled={device.alarm}     colorOn="#f59e0b"/>
            <SettingRow label="Time Sync"          enabled={device.timeSync}  colorOn="#7c3aed"/>
            <SettingRow label="Remote Access"      enabled={true}             colorOn="#10b981"/>
            <SettingRow label="Auto Restart"       enabled={false}            colorOn="#10b981"/>
          </div>
        )}

        {tab==="logs" && (
          <div style={{animation:"fadeIn .15s"}}>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {[
                {time:"Today 09:14",  event:"Door opened",       type:"open"},
                {time:"Today 09:02",  event:"Time sync completed",type:"sync"},
                {time:"Today 08:55",  event:"Device online",      type:"online"},
                {time:"Yesterday 23:59",event:"Device offline",   type:"offline"},
                {time:"Yesterday 18:30",event:"Door closed",      type:"close"},
                {time:"Yesterday 08:11",event:"Alarm triggered",  type:"alarm"},
              ].map((l,i)=>{
                const map = {open:["#10b981",I.unlock],sync:["#7c3aed",I.sync],online:["#10b981",I.wifi],offline:["#ef4444",I.close],close:["#0ea5e9",I.lock],alarm:["#f59e0b",I.bell]};
                const [c,ico] = map[l.type]||["#8b949e",I.device];
                return (
                  <div key={i} style={{
                    background:"#1c2128",border:"1px solid #30363d",
                    borderRadius:9,padding:"11px 13px",
                    display:"flex",alignItems:"center",gap:12
                  }}>
                    <div style={{width:28,height:28,borderRadius:7,background:`${c}18`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <Ic d={ico} size={13} color={c} sw={2}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12.5,color:"#e6edf3"}}>{l.event}</div>
                      <div style={{fontSize:10.5,color:"#6e7681",marginTop:1}}>{l.time}</div>
                    </div>
                    <div style={{width:7,height:7,borderRadius:"50%",background:c,flexShrink:0}}/>
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// ── Split View ────────────────────────────────────────────────
function SplitView({ devices, initialSelected, onBack, accent }) {
  const [selected, setSelected] = useState(initialSelected||devices[0]);
  const [search, setSearch] = useState("");

  const filtered = devices.filter(d=>
    d.name.toLowerCase().includes(search.toLowerCase()) ||
    d.company.toLowerCase().includes(search.toLowerCase()) ||
    d.serial.toLowerCase().includes(search.toLowerCase())
  );

  const pick = d => { setSelected(d); localStorage.setItem("dev_sel",d.id); };

  return (
    <div style={{display:"flex",height:"100%",overflow:"hidden",animation:"fadeIn .18s"}}>
      {/* List */}
      <div style={{width:280,flexShrink:0,borderRight:"1px solid #21262d",display:"flex",flexDirection:"column",background:"#161b22"}}>
        <div style={{padding:"16px 16px 12px",borderBottom:"1px solid #21262d",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={onBack} style={{
              width:28,height:28,borderRadius:7,border:"1px solid #30363d",
              background:"transparent",color:"#8b949e",cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",
              transition:"all .15s"
            }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#6e7681";e.currentTarget.style.color="#c9d1d9";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#30363d";e.currentTarget.style.color="#8b949e";}}>
              <Ic d={I.back} size={13} color="currentColor" sw={2}/>
            </button>
            <span style={{fontSize:14,fontWeight:700,color:"#e6edf3",flex:1}}>Devices</span>
            <span style={{fontSize:10.5,color:"#6e7681"}}>{filtered.length}</span>
          </div>
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",display:"flex"}}>
              <Ic d={I.search} size={12} color="#6e7681" sw={2}/>
            </span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search devices…"
              style={{
                width:"100%",background:"#0d1117",border:"1px solid #21262d",
                borderRadius:7,color:"#e6edf3",fontSize:12,
                padding:"7px 10px 7px 27px",outline:"none",transition:"border-color .15s"
              }}
              onFocus={e=>e.target.style.borderColor=accent}
              onBlur={e=>e.target.style.borderColor="#21262d"}
            />
          </div>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          {filtered.map(d=>{
            const active = selected?.id===d.id;
            const sc = d.status==="Online"?"#10b981":d.status==="Offline"?"#ef4444":"#f59e0b";
            return (
              <div key={d.id} onClick={()=>pick(d)} style={{
                padding:"10px 16px",cursor:"pointer",
                borderLeft:active?`3px solid ${accent}`:"3px solid transparent",
                background:active?`${accent}12`:"transparent",
                borderBottom:"1px solid #21262d18",transition:"all .1s"
              }}
              onMouseEnter={e=>{if(!active)e.currentTarget.style.background="#21262d44";}}
              onMouseLeave={e=>{if(!active)e.currentTarget.style.background="transparent";}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{
                    width:30,height:30,borderRadius:7,flexShrink:0,
                    background:`${accent}22`,border:`1px solid ${accent}33`,
                    display:"flex",alignItems:"center",justifyContent:"center"
                  }}>
                    <Ic d={I.device} size={14} color={accent} sw={1.8}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{
                      fontSize:12.5,fontWeight:active?600:400,
                      color:active?"#e6edf3":"#c9d1d9",
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"
                    }}>{d.name}</div>
                    <div style={{fontSize:10.5,color:"#6e7681",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.company}</div>
                  </div>
                  <span style={{width:6,height:6,borderRadius:"50%",background:sc,flexShrink:0}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Detail */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minWidth:0}}>
        {selected
          ? <DeviceDetail key={selected.id} device={selected} accent={accent}/>
          : (
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:"#6e7681"}}>
              <Ic d={I.device} size={40} color="#30363d" sw={1.5}/>
              <span style={{fontSize:14}}>Select a device</span>
            </div>
          )
        }
      </div>
    </div>
  );
}

// ── Table View ────────────────────────────────────────────────
function TableView({ devices, onSelect, accent }) {
  const [search, setSearch]         = useState("");
  const [serialSearch, setSerial]   = useState("");
  const [companyFilter, setCompany] = useState("All Companies");
  const [statusFilter, setStatus]   = useState("All");
  const [sortCol, setSortCol]       = useState(null);
  const [sortDir, setSortDir]       = useState("asc");
  const [page, setPage]             = useState(1);
  const PER = 15;

  const filtered = devices.filter(d=>{
    const q = search.toLowerCase();
    const sq = serialSearch.toLowerCase();
    const compMatch = companyFilter==="All Companies" || d.company===companyFilter;
    const statusMatch = statusFilter==="All" || d.status===statusFilter;
    const textMatch = !q || d.name.toLowerCase().includes(q) || d.company.toLowerCase().includes(q) || d.location.toLowerCase().includes(q);
    const serialMatch = !sq || d.serial.toLowerCase().includes(sq);
    return compMatch && statusMatch && textMatch && serialMatch;
  });

  const sorted = sortCol ? [...filtered].sort((a,b)=>{
    const av=String(a[sortCol]), bv=String(b[sortCol]);
    return sortDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
  }) : filtered;

  const totalPages = Math.ceil(sorted.length/PER)||1;
  const paged = sorted.slice((page-1)*PER, page*PER);

  const handleSort = col => {
    if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortCol(col); setSortDir("asc"); }
    setPage(1);
  };

  const online  = devices.filter(d=>d.status==="Online").length;
  const offline = devices.filter(d=>d.status==="Offline").length;
  const warning = devices.filter(d=>d.status==="Warning").length;

  const SortIc = ({col}) => (
    <span style={{marginLeft:3,color:sortCol===col?accent:"#3d4451",fontSize:9}}>
      {sortCol===col?(sortDir==="asc"?"↑":"↓"):"↕"}
    </span>
  );

  const TH = ({label,col,center,w}) => (
    <th onClick={()=>col&&handleSort(col)} style={{
      padding:"9px 10px",textAlign:center?"center":"left",fontSize:10,fontWeight:600,
      color:"#8b949e",textTransform:"uppercase",letterSpacing:".7px",
      borderBottom:"1px solid #21262d",userSelect:"none",
      cursor:col?"pointer":"default",whiteSpace:"nowrap",width:w
    }}>
      {label}{col&&<SortIc col={col}/>}
    </th>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden",animation:"fadeIn .2s"}}>

      {/* Top bar */}
      <div style={{padding:"20px 24px 14px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:11,color:"#8b949e",letterSpacing:".5px",marginBottom:3}}>MASTER PANEL</div>
          <h1 style={{fontSize:21,fontWeight:700,color:"#e6edf3",letterSpacing:"-.3px"}}>Devices List</h1>
        </div>
        {/* Online badge */}
        <button style={{
          background:`${accent}22`,border:`1px solid ${accent}44`,
          borderRadius:8,color:accent,fontWeight:700,fontSize:12,
          padding:"8px 16px",cursor:"pointer",letterSpacing:".5px",
          display:"flex",alignItems:"center",gap:7
        }}>
          <span style={{width:7,height:7,borderRadius:"50%",background:accent,display:"block"}}/>
          ONLINE DEVICES
          <span style={{
            background:accent,color:"#fff",borderRadius:12,
            fontSize:10,fontWeight:700,padding:"1px 6px"
          }}>{online}</span>
        </button>
      </div>

      {/* Filters row */}
      <div style={{padding:"0 24px 14px",display:"flex",gap:10,flexShrink:0,flexWrap:"wrap",alignItems:"center"}}>
        {/* Company filter */}
        <select value={companyFilter} onChange={e=>{setCompanyFilter&&setCompany(e.target.value);setPage(1);}} style={{
          background:"#161b22",border:"1px solid #21262d",borderRadius:8,
          color:"#c9d1d9",fontSize:12,padding:"8px 12px",outline:"none",
          cursor:"pointer",minWidth:200
        }}>
          {COMPANIES.map(c=><option key={c}>{c}</option>)}
        </select>

        {/* Serial search */}
        <div style={{position:"relative",flex:1,maxWidth:240}}>
          <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",display:"flex"}}>
            <Ic d={I.search} size={12} color="#6e7681" sw={2}/>
          </span>
          <input value={serialSearch} onChange={e=>{setSerial(e.target.value);setPage(1);}}
            placeholder="Serial Number"
            style={{
              width:"100%",background:"#161b22",border:"1px solid #21262d",
              borderRadius:8,color:"#e6edf3",fontSize:12,
              padding:"8px 12px 8px 28px",outline:"none",transition:"border-color .15s"
            }}
            onFocus={e=>e.target.style.borderColor=accent}
            onBlur={e=>e.target.style.borderColor="#21262d"}
          />
        </div>

        {/* Status filter pills */}
        <div style={{display:"flex",gap:6}}>
          {["All","Online","Offline","Warning"].map(s=>{
            const c = s==="Online"?"#10b981":s==="Offline"?"#ef4444":s==="Warning"?"#f59e0b":accent;
            const active = statusFilter===s;
            return (
              <button key={s} onClick={()=>{setStatus(s);setPage(1);}} style={{
                padding:"6px 12px",borderRadius:7,border:`1px solid ${active?c+"66":"#21262d"}`,
                background:active?`${c}18`:"transparent",
                color:active?c:"#8b949e",fontSize:11,fontWeight:active?600:400,cursor:"pointer",
                transition:"all .15s"
              }}>{s}{s!=="All"&&<span style={{marginLeft:5,fontSize:10,opacity:.7}}>
                {s==="Online"?online:s==="Offline"?offline:warning}
              </span>}</button>
            );
          })}
        </div>

        <div style={{marginLeft:"auto",fontSize:11,color:"#6e7681"}}>{filtered.length} devices</div>
      </div>

      {/* Table */}
      <div style={{flex:1,overflowY:"auto",padding:"0 24px 20px"}}>
        <div style={{background:"#161b22",border:"1px solid #21262d",borderRadius:12,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
            <colgroup>
              <col style={{width:"3%"}}/>
              <col style={{width:"19%"}}/>
              <col style={{width:"13%"}}/>
              <col style={{width:"9%"}}/>
              <col style={{width:"15%"}}/>
              <col style={{width:"6%"}}/>
              <col style={{width:"5%"}}/>
              <col style={{width:"6%"}}/>
              <col style={{width:"6%"}}/>
              <col style={{width:"5%"}}/>
              <col style={{width:"6%"}}/>
              <col style={{width:"7%"}}/>
            </colgroup>
            <thead>
              <tr style={{background:"#0d1117"}}>
                <TH label="#"                  col={null}           />
                <TH label="Company"            col="company"        />
                <TH label="Name"               col="name"           />
                <TH label="Location"           col="location"       />
                <TH label="Device Serial No."  col="serial"         />
                <TH label="Function"           col={null} center    />
                <TH label="Type"               col={null} center    />
                <TH label="Door Open"          col={null} center    />
                <TH label="Door Close"         col={null} center    />
                <TH label="Alarm"              col={null} center    />
                <TH label="Time Sync"          col={null} center    />
                <TH label="Status"             col="status"         />
              </tr>
            </thead>
            <tbody>
              {paged.map((d,idx)=>(
                <tr key={d.id}
                  onClick={()=>onSelect(d)}
                  style={{cursor:"pointer",transition:"background .1s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#1c2128"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  {/* # */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",fontSize:11,color:"#6e7681",textAlign:"left"}}>
                    {(page-1)*PER+idx+1}
                  </td>
                  {/* Company */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",overflow:"hidden"}}>
                    <div style={{fontSize:11.5,fontWeight:500,color:"#e6edf3",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.company}</div>
                    <div style={{fontSize:10,color:"#6e7681",marginTop:1}}>{d.branch}</div>
                  </td>
                  {/* Name */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",overflow:"hidden"}}>
                    <div style={{fontSize:11.5,fontWeight:500,color:"#e6edf3",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
                    <div style={{fontSize:10,color:"#6e7681",marginTop:1}}>{d.shortName}</div>
                  </td>
                  {/* Location */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",overflow:"hidden"}}>
                    <div style={{fontSize:11.5,color:"#c9d1d9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.location}</div>
                    <div style={{fontSize:10,color:"#6e7681",marginTop:1}}>{d.subLoc}</div>
                  </td>
                  {/* Serial */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",overflow:"hidden"}}>
                    <div style={{fontSize:10.5,color:"#e6edf3",fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.serial}</div>
                    <div style={{fontSize:9.5,color:"#6e7681",marginTop:1,fontFamily:"monospace"}}>{d.shortSerial}</div>
                  </td>
                  {/* Function */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",textAlign:"center"}}>
                    {d.func==="fingerprint"
                      ? <div style={{display:"flex",justifyContent:"center"}}><div style={{width:22,height:22,borderRadius:5,background:"#7c3aed18",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic d={I.fingerprint} size={13} color="#7c3aed" sw={1.8}/></div></div>
                      : <span style={{fontSize:9,color:"#8b949e",background:"#21262d",padding:"2px 5px",borderRadius:4}}>Option</span>
                    }
                  </td>
                  {/* Type */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d",textAlign:"center"}}>
                    <div style={{display:"flex",justifyContent:"center"}}>
                      <div style={{width:22,height:22,borderRadius:5,background:d.type==="biometric"?"#0ea5e918":"#f59e0b18",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <Ic d={d.type==="biometric"?I.users:I.camera} size={12} color={d.type==="biometric"?"#0ea5e9":"#f59e0b"} sw={1.8}/>
                      </div>
                    </div>
                  </td>
                  {/* Door Open */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d"}}>
                    <IconCell enabled={d.doorOpen} iconOn={I.unlock} iconOff={I.lock} colorOn="#10b981" colorOff="#ef4444" size={13}/>
                  </td>
                  {/* Door Close */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d"}}>
                    <IconCell enabled={d.doorClose} iconOn={I.lock} iconOff={I.unlock} colorOn="#0ea5e9" colorOff="#f59e0b" size={13}/>
                  </td>
                  {/* Alarm */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d"}}>
                    <IconCell enabled={d.alarm} iconOn={I.bell} iconOff={I.bell} colorOn="#f59e0b" colorOff="#6e7681" size={13}/>
                  </td>
                  {/* Time Sync */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d"}}>
                    <IconCell enabled={d.timeSync} iconOn={I.sync} iconOff={I.sync} colorOn="#10b981" colorOff="#6e7681" size={13}/>
                  </td>
                  {/* Status */}
                  <td style={{padding:"9px 10px",borderBottom:"1px solid #21262d"}}><StatusBadge status={d.status}/></td>

                </tr>
              ))}
            </tbody>
          </table>

          {/* Pagination */}
          <div style={{
            padding:"10px 16px",borderTop:"1px solid #21262d",background:"#0d1117",
            display:"flex",alignItems:"center",justifyContent:"space-between"
          }}>
            <span style={{fontSize:11,color:"#8b949e"}}>
              {sorted.length} results · page {page} of {totalPages}
            </span>
            <div style={{display:"flex",gap:5}}>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{
                width:26,height:26,borderRadius:5,background:"#161b22",
                border:"1px solid #21262d",color:page===1?"#3d4451":"#8b949e",
                cursor:page===1?"not-allowed":"pointer",fontSize:12,
                display:"flex",alignItems:"center",justifyContent:"center"
              }}>‹</button>
              {Array.from({length:totalPages},(_,i)=>i+1).slice(Math.max(0,page-3),page+2).map(n=>(
                <button key={n} onClick={()=>setPage(n)} style={{
                  width:26,height:26,borderRadius:5,
                  background:page===n?accent:"#161b22",
                  border:`1px solid ${page===n?accent:"#21262d"}`,
                  color:page===n?"#fff":"#8b949e",cursor:"pointer",fontSize:11,fontWeight:page===n?600:400
                }}>{n}</button>
              ))}
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages} style={{
                width:26,height:26,borderRadius:5,background:"#161b22",
                border:"1px solid #21262d",color:page===totalPages?"#3d4451":"#8b949e",
                cursor:page===totalPages?"not-allowed":"pointer",fontSize:12,
                display:"flex",alignItems:"center",justifyContent:"center"
              }}>›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────
function App() {
  const [view,     setView]     = useState("table");
  const [selected, setSelected] = useState(null);
  const [accent,   setAccent]   = useState(TWEAK_DEFAULTS.accent);

  useEffect(()=>{
    const sv = localStorage.getItem("dev_view");
    const ss = localStorage.getItem("dev_sel");
    if(sv) setView(sv);
    if(ss) { const f=DEVICES.find(d=>d.id===+ss); if(f) setSelected(f); }
    window.addEventListener("message",e=>{
      if(e.data?.type==="__activate_edit_mode")   document.getElementById("tweaks-panel").classList.add("open");
      if(e.data?.type==="__deactivate_edit_mode") document.getElementById("tweaks-panel").classList.remove("open");
    });
    window.parent.postMessage({type:"__edit_mode_available"},"*");
    document.getElementById("tw-accent").addEventListener("change",e=>{
      setAccent(e.target.value);
      window.parent.postMessage({type:"__edit_mode_set_keys",edits:{accent:e.target.value}},"*");
    });
  },[]);

  const goDetail = d => { setSelected(d); setView("split"); localStorage.setItem("dev_view","split"); localStorage.setItem("dev_sel",d.id); };
  const goTable  = () => { setView("table"); localStorage.setItem("dev_view","table"); };

  return (
    <div style={{display:"flex",height:"100vh",background:"#0d1117",color:"#e6edf3",overflow:"hidden"}}>
      <NavRail accent={accent}/>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view==="table"
          ? <TableView devices={DEVICES} onSelect={goDetail} accent={accent}/>
          : <SplitView devices={DEVICES} initialSelected={selected} onBack={goTable} accent={accent}/>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
