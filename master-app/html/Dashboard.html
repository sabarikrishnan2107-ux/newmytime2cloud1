<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>mytime2cloud – Dashboard</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      height: 100%;
      background: #0d1117;
      font-family: 'Inter', sans-serif;
      color: #e6edf3;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes countUp {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    #tweaks-panel {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      z-index: 9999;
      width: 220px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
    }

    #tweaks-panel.open {
      display: block;
    }

    #tweaks-panel h4 {
      color: #e6edf3;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .tw-row {
      margin-bottom: 10px;
    }

    .tw-row label {
      display: block;
      color: #8b949e;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .tw-row select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 12px;
      padding: 5px 8px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="tweaks-panel">
    <h4>Tweaks</h4>
    <div class="tw-row"><label>Accent</label>
      <select id="tw-accent">
        <option value="#7c3aed">Violet</option>
        <option value="#0ea5e9">Sky Blue</option>
        <option value="#10b981">Emerald</option>
        <option value="#f59e0b">Amber</option>
      </select>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "accent": "#7c3aed" }/*EDITMODE-END*/;

    // ── Icons ─────────────────────────────────────────────────────
    const Ic = ({ d, size = 16, color = "currentColor", sw = 1.8 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {(Array.isArray(d) ? d : [d]).map((p, i) => <path key={i} d={p} />)}
      </svg>
    );
    const I = {
      home: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
      grid: ["M3 3h7v7H3z", "M14 3h7v7h-7z", "M3 14h7v7H3z", "M14 14h7v7h-7z"],
      device: "M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M12 18h.01",
      users: ["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2", "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"],
      clock: ["M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z", "M12 6v6l4 2"],
      cal: ["M8 2v4", "M16 2v4", "M3 10h18", "M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"],
      build: ["M3 21h18", "M5 21V7l8-4v18", "M19 21V11l-6-4"],
      wifi: ["M5 12.55a11 11 0 0 1 14.08 0", "M1.42 9a16 16 0 0 1 21.16 0", "M8.53 16.11a6 6 0 0 1 6.95 0", "M12 20h.01"],
      alert: ["M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z", "M12 9v4", "M12 17h.01"],
      trending: ["M23 6l-9.5 9.5-5-5L1 18", "M17 6h6v6"],
      plus: "M12 5v14M5 12h14",
      arrow: "M5 12h14M12 5l7 7-7 7",
      refresh: ["M23 4v6h-6", "M1 20v-6h6", "M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"],
      log: ["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z", "M14 2v6h6", "M16 13H8", "M16 17H8", "M10 9H8"],
      check: "M20 6L9 17l-5-5",
      lock: ["M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z", "M7 11V7a5 5 0 0 1 10 0v4"],
      bell: ["M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9", "M13.73 21a2 2 0 0 1-3.46 0"],
    };

    // ── Mock data ─────────────────────────────────────────────────
    const STATS = {
      companies: 20, employees: 428, devices: 127,
      online: 98, offline: 21, warning: 8, branches: 52,
    };

    const BAR_DATA = [
      { month: "Oct", companies: 14, devices: 82 },
      { month: "Nov", companies: 15, devices: 89 },
      { month: "Dec", companies: 16, devices: 95 },
      { month: "Jan", companies: 17, devices: 101 },
      { month: "Feb", companies: 18, devices: 109 },
      { month: "Mar", companies: 19, devices: 118 },
      { month: "Apr", companies: 20, devices: 127 },
    ];

    const LINE_DATA = [
      { day: "Mon", attendance: 312 }, { day: "Tue", attendance: 348 },
      { day: "Wed", attendance: 291 }, { day: "Thu", attendance: 375 },
      { day: "Fri", attendance: 356 }, { day: "Sat", attendance: 198 },
      { day: "Sun", attendance: 87 },
    ];

    const TOP_COMPANIES = [
      { name: "Hilal Cleaning Company", employees: 85, branches: 6, devices: 14, status: "Active" },
      { name: "Icarus Dubai", employees: 57, branches: 5, devices: 12, status: "Active" },
      { name: "Petrotek", employees: 31, branches: 4, devices: 9, status: "Active" },
      { name: "Jovee Restaurant", employees: 30, branches: 3, devices: 7, status: "Active" },
      { name: "ONGROUND Hospitality", employees: 24, branches: 4, devices: 8, status: "Active" },
      { name: "Al Fayrouz Metal Mfg", employees: 29, branches: 3, devices: 7, status: "Active" },
    ];

    const RECENT_LOGS = [
      { time: "2m ago", device: "SHAWARMA-01", company: "SHAWARMA MAP", event: "Door opened", type: "open" },
      { time: "5m ago", device: "OX-645", company: "YELLOW BOX", event: "Time sync done", type: "sync" },
      { time: "12m ago", device: "Finger Print", company: "Demo Company", event: "Device offline", type: "offline" },
      { time: "18m ago", device: "AKIL", company: "V PERFUMES", event: "Alarm triggered", type: "alarm" },
      { time: "24m ago", device: "Souq-01", company: "Icarus Dubai", event: "Door closed", type: "close" },
      { time: "31m ago", device: "DEV-011", company: "Imperius Trading", event: "Device online", type: "online" },
      { time: "45m ago", device: "OXSAI", company: "AXALAR EPC DMCC", event: "Time sync done", type: "sync" },
      { time: "1h ago", device: "DPS-01", company: "Delhi Progressive", event: "Door opened", type: "open" },
    ];

    const ACTIVITY_FEED = [
      { time: "09:14", action: "New company added", detail: "Zukti Trading LLC", type: "company" },
      { time: "09:02", action: "Device registered", detail: "OX-9452025011043 · YELLOW BOX", type: "device" },
      { time: "08:55", action: "Employee added", detail: "Ahmed Al Rashid · Icarus Dubai", type: "employee" },
      { time: "08:30", action: "Branch created", detail: "Branch 3 · Jovee Restaurant", type: "branch" },
      { time: "Yesterday", action: "Company updated", detail: "SHAWARMA MAP RESTAURANT", type: "company" },
      { time: "Yesterday", action: "Device alarm", detail: "AKIL · V PERFUMES", type: "alert" },
    ];

    // ── Helpers ───────────────────────────────────────────────────
    const PAL = ["#7c3aed", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4", "#ec4899"];
    const avatarBg = n => { let h = 0; for (let c of n) h = (h * 31 + c.charCodeAt(0)) % PAL.length; return PAL[Math.abs(h)]; };

    // ── Nav rail ─────────────────────────────────────────────────
    const NAV_ITEMS = [
      { icon: I.home, title: "Dashboard", active: true },
      { icon: I.grid, title: "Companies" },
      { icon: I.device, title: "Devices" },
      { icon: I.users, title: "Communities" },
      { icon: I.log, title: "Missing Logs" },
      { icon: I.cal, title: "Web Logs" },
      { icon: I.clock, title: "Schedule" },
    ];

    function NavRail({ accent }) {
      return (
        <aside style={{
          width: 60, background: "#161b22", borderRight: "1px solid #21262d",
          display: "flex", flexDirection: "column", alignItems: "center",
          padding: "14px 0", gap: 4, flexShrink: 0
        }}>
          <div style={{
            width: 34, height: 34, borderRadius: 9, background: accent,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 15, fontWeight: 800, color: "#fff", marginBottom: 18
          }}>M</div>
          {NAV_ITEMS.map((item, i) => (
            <button key={i} title={item.title} style={{
              width: 36, height: 36, borderRadius: 8, border: "none", cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              background: item.active ? `${accent}22` : "transparent",
              color: item.active ? accent : "#6e7681", transition: "all .15s"
            }}
              onMouseEnter={e => { if (!item.active) { e.currentTarget.style.background = "#21262d"; e.currentTarget.style.color = "#c9d1d9"; } }}
              onMouseLeave={e => { if (!item.active) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "#6e7681"; } }}>
              <Ic d={item.icon} size={16} color="currentColor" sw={item.active ? 2.2 : 1.7} />
            </button>
          ))}
        </aside>
      );
    }

    // ── Stat Card ─────────────────────────────────────────────────
    function StatCard({ label, value, icon, accent, color, trend, delay = 0 }) {
      const c = color || accent;
      return (
        <div style={{
          background: "#161b22", border: "1px solid #21262d", borderRadius: 12,
          padding: "16px 18px", display: "flex", flexDirection: "column", gap: 12,
          animation: `fadeUp .4s ease ${delay}ms both`, cursor: "default",
          transition: "border-color .2s,transform .2s",
        }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = `${c}55`; e.currentTarget.style.transform = "translateY(-1px)"; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = "#21262d"; e.currentTarget.style.transform = "translateY(0)"; }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{
              width: 36, height: 36, borderRadius: 10, background: `${c}20`,
              display: "flex", alignItems: "center", justifyContent: "center"
            }}>
              <Ic d={icon} size={17} color={c} sw={2} />
            </div>
            {trend != null && (
              <span style={{
                fontSize: 10.5, fontWeight: 600,
                color: trend >= 0 ? "#10b981" : "#ef4444",
                background: trend >= 0 ? "#10b98118" : "#ef444418",
                padding: "2px 7px", borderRadius: 20
              }}>{trend >= 0 ? "+" : ""}{trend}%</span>
            )}
          </div>
          <div>
            <div style={{ fontSize: 26, fontWeight: 800, color: "#e6edf3", lineHeight: 1, letterSpacing: "-.5px" }}>{value.toLocaleString()}</div>
            <div style={{ fontSize: 11, color: "#8b949e", marginTop: 5, letterSpacing: ".2px" }}>{label}</div>
          </div>
        </div>
      );
    }

    // ── Bar Chart ─────────────────────────────────────────────────
    function BarChart({ data, accent }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();
        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.map(d => d.month),
            datasets: [
              {
                label: 'Devices',
                data: data.map(d => d.devices),
                backgroundColor: accent + 'bb',
                borderColor: accent,
                borderWidth: 0,
                borderRadius: 6,
                borderSkipped: false,
              },
              {
                label: 'Companies',
                data: data.map(d => d.companies),
                backgroundColor: '#10b981bb',
                borderColor: '#10b981',
                borderWidth: 0,
                borderRadius: 6,
                borderSkipped: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#1c2128',
                borderColor: '#30363d',
                borderWidth: 1,
                titleColor: '#8b949e',
                bodyColor: '#e6edf3',
                padding: 12,
                cornerRadius: 8,
              },
            },
            scales: {
              x: {
                border: { display: false },
                grid: { color: '#21262d' },
                ticks: { color: '#6e7681', font: { size: 11, family: 'Inter' } },
              },
              y: {
                border: { display: false },
                grid: { color: '#21262d' },
                ticks: { color: '#6e7681', font: { size: 11, family: 'Inter' } },
              },
            },
          },
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data, accent]);

      return <div style={{ position: "relative", height: 190 }}><canvas ref={canvasRef} /></div>;
    }

    // ── Line Chart ────────────────────────────────────────────────
    function LineChart({ data, accent }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();
        const ctx = canvasRef.current.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, accent + '55');
        gradient.addColorStop(1, accent + '00');

        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.day),
            datasets: [{
              label: 'Check-ins',
              data: data.map(d => d.attendance),
              borderColor: accent,
              borderWidth: 2.5,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: accent,
              pointBorderColor: '#fff',
              pointBorderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 7,
              pointHoverBackgroundColor: '#fff',
              pointHoverBorderColor: accent,
              pointHoverBorderWidth: 2.5,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#1c2128',
                borderColor: '#30363d',
                borderWidth: 1,
                titleColor: '#8b949e',
                bodyColor: '#e6edf3',
                padding: 12,
                cornerRadius: 8,
              },
            },
            scales: {
              x: {
                border: { display: false },
                grid: { color: '#21262d' },
                ticks: { color: '#6e7681', font: { size: 11, family: 'Inter' } },
              },
              y: {
                border: { display: false },
                grid: { color: '#21262d' },
                ticks: { color: '#6e7681', font: { size: 11, family: 'Inter' } },
              },
            },
          },
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data, accent]);

      return <div style={{ position: "relative", height: 190 }}><canvas ref={canvasRef} /></div>;
    }

    // ── Donut Chart ───────────────────────────────────────────────
    function DonutChart({ online, offline, warning, accent }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (chartRef.current) chartRef.current.destroy();
        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Online', 'Warning', 'Offline'],
            datasets: [{
              data: [online, warning, offline],
              backgroundColor: ['#10b981cc', '#f59e0bcc', '#ef4444cc'],
              borderColor: ['#10b981', '#f59e0b', '#ef4444'],
              borderWidth: 2,
              hoverOffset: 10,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '68%',
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  color: '#c9d1d9',
                  font: { size: 12, family: 'Inter' },
                  padding: 18,
                  usePointStyle: true,
                  pointStyleWidth: 10,
                },
              },
              tooltip: {
                backgroundColor: '#1c2128',
                borderColor: '#30363d',
                borderWidth: 1,
                titleColor: '#8b949e',
                bodyColor: '#e6edf3',
                padding: 12,
                cornerRadius: 8,
              },
            },
          },
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [online, offline, warning]);

      return <div style={{ height: 170 }}><canvas ref={canvasRef} /></div>;
    }

    // ── Section Card wrapper ──────────────────────────────────────
    function Card({ title, subtitle, children, action, delay = 0, style: s = {} }) {
      return (
        <div style={{
          background: "#161b22", border: "1px solid #21262d", borderRadius: 14,
          display: "flex", flexDirection: "column",
          animation: `fadeUp .4s ease ${delay}ms both`, ...s
        }}>
          <div style={{
            padding: "16px 20px 14px", borderBottom: "1px solid #21262d",
            display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0
          }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#e6edf3" }}>{title}</div>
              {subtitle && <div style={{ fontSize: 11, color: "#8b949e", marginTop: 2 }}>{subtitle}</div>}
            </div>
            {action}
          </div>
          <div style={{ flex: 1, overflow: "visible" }}>{children}</div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────
    function App() {
      const [accent, setAccent] = useState(TWEAK_DEFAULTS.accent);
      const today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      useEffect(() => {
        window.addEventListener("message", e => {
          if (e.data?.type === "__activate_edit_mode") document.getElementById("tweaks-panel").classList.add("open");
          if (e.data?.type === "__deactivate_edit_mode") document.getElementById("tweaks-panel").classList.remove("open");
        });
        window.parent.postMessage({ type: "__edit_mode_available" }, "*");
        document.getElementById("tw-accent").addEventListener("change", e => {
          setAccent(e.target.value);
          window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { accent: e.target.value } }, "*");
        });
      }, []);

      const logColors = { open: "#10b981", sync: "#7c3aed", offline: "#ef4444", alarm: "#f59e0b", close: "#0ea5e9", online: "#10b981" };
      const logIcons = { open: I.lock, sync: I.refresh, offline: I.device, alarm: I.bell, close: I.lock, online: I.wifi };
      const actColors = { company: accent, device: "#0ea5e9", employee: "#10b981", branch: "#f59e0b", alert: "#ef4444" };
      const actIcons = { company: I.grid, device: I.device, employee: I.users, branch: I.build, alert: I.alert };

      return (
        <div style={{ display: "flex", height: "100vh", background: "#0d1117", overflow: "hidden" }}>
          <NavRail accent={accent} />

          {/* Main scroll area */}
          <div style={{ flex: 1, overflowY: "auto", padding: "22px 24px 28px" }}>

            {/* Top bar */}
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 22 }}>
              <div>
                <div style={{ fontSize: 11, color: "#8b949e", letterSpacing: ".5px", marginBottom: 3 }}>OVERVIEW</div>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: "#e6edf3", letterSpacing: "-.4px" }}>Dashboard</h1>
                <div style={{ fontSize: 11.5, color: "#6e7681", marginTop: 3 }}>{today}</div>
              </div>
              {/* Quick actions */}
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                {[
                  { label: "Add Company", icon: I.grid, color: accent },
                  { label: "Add Device", icon: I.device, color: "#0ea5e9" },
                  { label: "View Logs", icon: I.log, color: "#10b981" },
                ].map(a => (
                  <button key={a.label} style={{
                    display: "flex", alignItems: "center", gap: 7,
                    padding: "8px 14px", borderRadius: 9, border: `1px solid ${a.color}33`,
                    background: `${a.color}12`, color: a.color,
                    fontSize: 12, fontWeight: 600, cursor: "pointer",
                    transition: "all .15s"
                  }}
                    onMouseEnter={e => { e.currentTarget.style.background = `${a.color}22`; e.currentTarget.style.borderColor = `${a.color}66`; }}
                    onMouseLeave={e => { e.currentTarget.style.background = `${a.color}12`; e.currentTarget.style.borderColor = `${a.color}33`; }}>
                    <Ic d={a.icon} size={13} color={a.color} sw={2} />
                    {a.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Stat cards — row 1 */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(6,1fr)", gap: 12, marginBottom: 18 }}>
              <StatCard label="Total Companies" value={STATS.companies} icon={I.grid} accent={accent} trend={+5} delay={0} />
              <StatCard label="Total Employees" value={STATS.employees} icon={I.users} accent={accent} color="#0ea5e9" trend={+12} delay={50} />
              <StatCard label="Total Devices" value={STATS.devices} icon={I.device} accent={accent} color="#8b5cf6" trend={+8} delay={100} />
              <StatCard label="Online Devices" value={STATS.online} icon={I.wifi} color="#10b981" accent={accent} trend={+3} delay={150} />
              <StatCard label="Offline Devices" value={STATS.offline} icon={I.alert} color="#ef4444" accent={accent} trend={-2} delay={200} />
              <StatCard label="Total Branches" value={STATS.branches} icon={I.build} color="#06b6d4" accent={accent} trend={+4} delay={300} />
            </div>

            {/* Row 2: Bar chart + Donut 
            <div style={{ display: "grid", gridTemplateColumns: "1fr 340px", gap: 14, marginBottom: 14 }}>
              <Card title="Growth Overview" subtitle="Companies & devices — last 7 months"
                delay={350}
                action={
                  <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2, background: accent }} />
                      <span style={{ fontSize: 11, color: "#8b949e" }}>Devices</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2, background: "#10b981" }} />
                      <span style={{ fontSize: 11, color: "#8b949e" }}>Companies</span>
                    </div>
                  </div>
                }>
                <div style={{ padding: "14px 20px 10px" }}>
                  <BarChart data={BAR_DATA} accent={accent} />
                </div>
              </Card>

              <Card title="Device Status" subtitle="Current breakdown" delay={400}>
                <div style={{ padding: "14px 20px 10px" }}>
                  <DonutChart online={STATS.online} offline={STATS.offline} warning={STATS.warning} accent={accent} />
                </div>
              </Card>
            </div>
            */}

            {/* Row 3: Line chart + Activity feed */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:14,marginBottom:14}}>
          <Card title="Attendance Trend" subtitle="Check-ins this week" delay={450}>
            <div style={{padding:"14px 20px 10px",overflow:"visible"}}>
              <LineChart data={LINE_DATA} accent={accent}/>
            </div>
          </Card>

          <Card title="Recent Activity" subtitle="Latest system events" delay={500}
            action={
              <button style={{
                fontSize:11,color:"#8b949e",background:"none",border:"none",
                cursor:"pointer",display:"flex",alignItems:"center",gap:4
              }}>View all <Ic d={I.arrow} size={11} color="#8b949e" sw={2}/></button>
            }>
            <div style={{overflowY:"auto",maxHeight:168}}>
              {ACTIVITY_FEED.map((a,i)=>{
                const c = actColors[a.type]||accent;
                return (
                  <div key={i} style={{
                    padding:"10px 20px",borderBottom:"1px solid #21262d18",
                    display:"flex",alignItems:"center",gap:11
                  }}>
                    <div style={{
                      width:28,height:28,borderRadius:7,flexShrink:0,
                      background:`${c}18`,display:"flex",alignItems:"center",justifyContent:"center"
                    }}>
                      <Ic d={actIcons[a.type]||I.check} size={13} color={c} sw={2}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,color:"#e6edf3",fontWeight:500}}>{a.action}</div>
                      <div style={{fontSize:10.5,color:"#6e7681",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.detail}</div>
                    </div>
                    <span style={{fontSize:10,color:"#6e7681",flexShrink:0}}>{a.time}</span>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>

            {/* Row 4: Top companies + Device logs */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 340px", gap: 14 }}>
              <Card title="Top Companies" subtitle="Ranked by employee count" delay={550}
                action={
                  <button style={{
                    fontSize: 11, color: "#8b949e", background: "none", border: "none",
                    cursor: "pointer", display: "flex", alignItems: "center", gap: 4
                  }}>View all <Ic d={I.arrow} size={11} color="#8b949e" sw={2} /></button>
                }>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse" }}>
                    <thead>
                      <tr style={{ background: "#0d1117" }}>
                        {["Company", "Employees", "Branches", "Devices", "Status"].map(h => (
                          <th key={h} style={{
                            padding: "8px 16px", textAlign: "left", fontSize: 10,
                            fontWeight: 600, color: "#8b949e", textTransform: "uppercase",
                            letterSpacing: ".7px", borderBottom: "1px solid #21262d", whiteSpace: "nowrap"
                          }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {TOP_COMPANIES.map((c, i) => (
                        <tr key={i}
                          style={{ transition: "background .1s", cursor: "pointer" }}
                          onMouseEnter={e => e.currentTarget.style.background = "#1c2128"}
                          onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                          <td style={{ padding: "10px 16px", borderBottom: "1px solid #21262d" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                              <div style={{
                                width: 26, height: 26, borderRadius: 6, flexShrink: 0,
                                background: `${avatarBg(c.name)}20`,
                                display: "flex", alignItems: "center", justifyContent: "center",
                                fontSize: 11, fontWeight: 700, color: avatarBg(c.name)
                              }}>{c.name.charAt(0)}</div>
                              <span style={{ fontSize: 12.5, fontWeight: 500, color: "#e6edf3" }}>{c.name}</span>
                            </div>
                          </td>
                          <td style={{ padding: "10px 16px", borderBottom: "1px solid #21262d" }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                              <div style={{
                                height: 5, borderRadius: 3, width: Math.round((c.employees / 85) * 80),
                                background: `${accent}66`, maxWidth: 80
                              }} />
                              <span style={{ fontSize: 12, fontWeight: 600, color: "#e6edf3" }}>{c.employees}</span>
                            </div>
                          </td>
                          <td style={{ padding: "10px 16px", borderBottom: "1px solid #21262d", fontSize: 12, color: "#c9d1d9" }}>{c.branches}</td>
                          <td style={{ padding: "10px 16px", borderBottom: "1px solid #21262d", fontSize: 12, color: "#c9d1d9" }}>{c.devices}</td>
                          <td style={{ padding: "10px 16px", borderBottom: "1px solid #21262d" }}>
                            <span style={{
                              fontSize: 10.5, fontWeight: 500, color: "#10b981",
                              background: "#10b98118", padding: "2px 8px", borderRadius: 20,
                              display: "inline-flex", alignItems: "center", gap: 4
                            }}>
                              <span style={{ width: 4, height: 4, borderRadius: "50%", background: "#10b981", display: "block" }} />
                              Active
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>

              {/* Recent Device Logs */}
              <Card title="Recent Device Logs" subtitle="Last 8 events" delay={600}
                action={
                  <button style={{
                    fontSize: 11, color: "#8b949e", background: "none", border: "none",
                    cursor: "pointer", display: "flex", alignItems: "center", gap: 4
                  }}>View all <Ic d={I.arrow} size={11} color="#8b949e" sw={2} /></button>
                }>
                <div style={{ overflowY: "auto" }}>
                  {RECENT_LOGS.map((l, i) => {
                    const c = logColors[l.type] || "#8b949e";
                    return (
                      <div key={i} style={{
                        padding: "9px 20px", borderBottom: "1px solid #21262d18",
                        display: "flex", alignItems: "center", gap: 11,
                        transition: "background .1s", cursor: "pointer"
                      }}
                        onMouseEnter={e => e.currentTarget.style.background = "#1c2128"}
                        onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                        <div style={{
                          width: 26, height: 26, borderRadius: 6, flexShrink: 0,
                          background: `${c}18`, display: "flex", alignItems: "center", justifyContent: "center"
                        }}>
                          <Ic d={logIcons[l.type] || I.device} size={12} color={c} sw={2} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 11.5, color: "#e6edf3", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.device}</div>
                          <div style={{ fontSize: 10.5, color: "#6e7681", marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.event} · {l.company}</div>
                        </div>
                        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", flexShrink: 0, gap: 3 }}>
                          <span style={{ fontSize: 9.5, color: "#6e7681" }}>{l.time}</span>
                          <span style={{ width: 6, height: 6, borderRadius: "50%", background: c, display: "block" }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
