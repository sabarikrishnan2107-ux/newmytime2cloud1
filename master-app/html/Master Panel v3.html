// ── Helpers ───────────────────────────────────────────────────
const PAL = ["#7c3aed","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899"];
const avatarBg = name => { let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))%PAL.length; return PAL[Math.abs(h)]; };

function Avatar({ name, size=32 }) {
  const bg = avatarBg(name);
  return (
    <div style={{
      width:size,height:size,flexShrink:0,
      borderRadius:size>42?12:8,
      background:`${bg}28`,border:`1.5px solid ${bg}50`,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:Math.round(size*.4),fontWeight:700,color:bg
    }}>{name.charAt(0).toUpperCase()}</div>
  );
}

function StatusBadge({ status }) {
  const c = status==="Active" ? "#10b981" : "#f59e0b";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,
      fontSize:11,fontWeight:500,color:c,background:`${c}18`,
      padding:"3px 9px",borderRadius:20}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:c,display:"block"}}/>

  );
}

function NavRail({ accent }) {

    <aside style={{
      width:60,background:"#161b22",borderRight:"1px solid #21262d",
      display:"flex",flexDirection:"column",alignItems:"center",
      padding:"16px 0",gap:4,flexShrink:0

          width:36,height:36,borderRadius:8,border:"none",cursor:"pointer",

      ))}

// ── Field (read-only) ─────────────────────────────────────────
function Field({ label, value }) {
  return (
    <div style={{background:"#1c2128",border:"1px solid #30363d",borderRadius:9,padding:"12px 14px"}}>
      <div style={{fontSize:10,color:"#6e7681",textTransform:"uppercase",letterSpacing:".8px",marginBottom:5}}>{label}</div>
      <div style={{fontSize:13,color:"#e6edf3"}}>{value}</div>
    </div>
  );
}

// ── Input ─────────────────────────────────────────────────────
function Input({ label, value, onChange, placeholder, type="text", accent }) {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <label style={{fontSize:10.5,color:"#8b949e",letterSpacing:".4px"}}>{label}</label>
      <input type={type} value={value} placeholder={placeholder}
        onChange={e=>onChange(e.target.value)}
        style={{
          background:"#1c2128",border:"1px solid #30363d",borderRadius:8,
          color:"#e6edf3",fontSize:13,padding:"10px 13px",outline:"none",
          transition:"border-color .15s",width:"100%",colorScheme:"dark"
        }}
        onFocus={e=>e.target.style.borderColor=accent}
        onBlur={e=>e.target.style.borderColor="#30363d"}
      />
    </div>
  );
}

// ── Stat Card ─────────────────────────────────────────────────
function StatCard({ label, value, icon, accent, sub }) {
  return (
    <div style={{
      background:"#1c2128",border:"1px solid #30363d",borderRadius:12,
      padding:"16px 18px",display:"flex",flexDirection:"column",gap:10
    }}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{
          width:34,height:34,borderRadius:9,background:`${accent}22`,
          display:"flex",alignItems:"center",justifyContent:"center"
        }}>
          <Ic d={icon} size={16} color={accent} sw={2}/>
        </div>
        <span style={{fontSize:10,fontWeight:600,color:"#10b981",background:"#10b98118",padding:"2px 7px",borderRadius:20}}>Active</span>

      <div>
        <div style={{fontSize:24,fontWeight:700,color:"#e6edf3",lineHeight:1}}>{value}</div>
        <div style={{fontSize:11,color:"#8b949e",marginTop:4}}>{label}</div>
        {sub && <div style={{fontSize:10,color:"#6e7681",marginTop:2}}>{sub}</div>}
      </div>
    </div>
  );
}

// ── Tab Button ────────────────────────────────────────────────
function TabBtn({ active, label, icon, onClick, accent }) {
  return (
    <button onClick={onClick} style={{
      background:"none",border:"none",cursor:"pointer",
      padding:"11px 16px",display:"flex",alignItems:"center",gap:7,
      fontSize:12.5,fontWeight:active?600:400,
      color:active?accent:"#8b949e",
      borderBottom:active?`2px solid ${accent}`:"2px solid transparent",
      transition:"all .15s",whiteSpace:"nowrap"
    }}>
      <Ic d={icon} size={13} color={active?accent:"#8b949e"} sw={2}/>
      {label}
    </button>
  );
}

// ── Btn ───────────────────────────────────────────────────────
function Btn({ children, onClick, accent, ghost, icon, disabled }) {
  const base = {
    padding:"9px 20px",borderRadius:8,fontSize:13,fontWeight:600,
    cursor:disabled?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:7,
    transition:"opacity .15s",border:"none"
  };
  const style = ghost
    ? {...base,background:"transparent",border:"1px solid #30363d",color:disabled?"#3d4451":"#8b949e"}
    : {...base,background:accent,color:"#fff",boxShadow:`0 2px 10px ${accent}44`,opacity:disabled?.5:1};
  return (
    <button onClick={onClick} disabled={disabled} style={style}
      onMouseEnter={e=>{if(!disabled)e.currentTarget.style.opacity=".85";}}
      onMouseLeave={e=>{e.currentTarget.style.opacity="1";}}>
      {icon && <Ic d={icon} size={13} color={ghost?"#8b949e":"#fff"} sw={2.5}/>}
      {children}
    </button>
  );
}

// ── Create Company (3-step) ───────────────────────────────────
function CreateCompany({ onCancel, accent }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    code:"", name:"", email:"", molId:"", poBox:"",
    memberFrom:"", expiryDate:"",
    maxBranches:"1", maxEmployees:"10", maxDevices:"1",
    contactName:"", contactNumber:"", contactPosition:"", contactWhatsapp:"",
    location:"", lat:"", lon:""

  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const STEPS = [{n:1,label:"Profile"},{n:2,label:"Contact"},{n:3,label:"Location"}];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden",animation:"fadeIn .2s ease"}}>

          <h2 style={{fontSize:17,fontWeight:700,color:"#e6edf3"}}>Create Company</h2>
        </div>
        <Btn ghost accent={accent} icon={I.close} onClick={onCancel}>Cancel</Btn>
      </div>

      {/* Steps */}
      <div style={{padding:"20px 28px 0",background:"#161b22",flexShrink:0}}>

          {STEPS.map((s,i) => (
            <React.Fragment key={s.n}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,cursor:"pointer"}}
                onClick={()=>s.n<step&&setStep(s.n)}>
                <div style={{
                  width:32,height:32,borderRadius:"50%",
                  background:step>=s.n?accent:"#21262d",
                  border:step===s.n?`2px solid ${accent}`:step>s.n?"none":"2px solid #30363d",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  color:step>=s.n?"#fff":"#6e7681",fontSize:12,fontWeight:700,transition:"all .2s"
                }}>
                  {step>s.n ? <Ic d={I.check} size={13} color="#fff" sw={2.5}/> : s.n}
                </div>
                <span style={{fontSize:11,fontWeight:step===s.n?600:400,color:step===s.n?accent:step>s.n?"#c9d1d9":"#6e7681",whiteSpace:"nowrap"}}>
                  Step {s.n}: {s.label}
                </span>
              </div>
              {i<STEPS.length-1 && (
                <div style={{flex:1,height:2,margin:"0 8px",marginBottom:20,background:step>s.n?accent:"#30363d",transition:"background .3s"}}/>
              )}

          ))}
        </div>
      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:"auto",padding:"24px 28px",background:"#0d1117"}}>

        {step===1 && (
          <div style={{display:"flex",flexDirection:"column",gap:16,animation:"fadeIn .15s"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
              <Input label="Company Code *"  value={form.code}  onChange={v=>set("code",v)}  placeholder="e.g. AE00074"      accent={accent}/>
              <Input label="Company Name *"  value={form.name}  onChange={v=>set("name",v)}  placeholder="Enter company name" accent={accent}/>
              <Input label="Company Email *" value={form.email} onChange={v=>set("email",v)} placeholder="email@company.com" type="email" accent={accent}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
              <Input label="Mol ID *"      value={form.molId}      onChange={v=>set("molId",v)}      placeholder="Enter Mol ID"  accent={accent}/>
              <Input label="P.O Box *"     value={form.poBox}      onChange={v=>set("poBox",v)}      placeholder="Enter P.O Box" accent={accent}/>
              <Input label="Member From *" value={form.memberFrom} onChange={v=>set("memberFrom",v)} placeholder="dd/mm/yyyy" type="date" accent={accent}/>
              <Input label="Expiry Date *" value={form.expiryDate} onChange={v=>set("expiryDate",v)} placeholder="dd/mm/yyyy" type="date" accent={accent}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
              <Input label="Max Branches *"  value={form.maxBranches}  onChange={v=>set("maxBranches",v)}  placeholder="e.g. 1"  accent={accent}/>
              <Input label="Max Employees *" value={form.maxEmployees} onChange={v=>set("maxEmployees",v)} placeholder="e.g. 10" accent={accent}/>
              <Input label="Max Devices *"   value={form.maxDevices}   onChange={v=>set("maxDevices",v)}   placeholder="e.g. 1"  accent={accent}/>
            </div>

// TABLE VIEW (Long / Default)
// ─────────────────────────────────────────────────────────────
function TableView({ companies, onSelect, onCreate, accent }) {
  const [creating, setCreating] = useState(false);
  const [search, setSearch] = useState("");
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [page, setPage] = useState(1);
  const PER = 12;

  const filtered = companies.filter(c=>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.email.toLowerCase().includes(search.toLowerCase()) ||
    c.code.toLowerCase().includes(search.toLowerCase())
  );
  const sorted = sortCol ? [...filtered].sort((a,b)=>{
    const av=String(a[sortCol]), bv=String(b[sortCol]);
    return sortDir==="asc"?av.localeCompare(bv,undefined,{numeric:true}):bv.localeCompare(av,undefined,{numeric:true});
  }) : filtered;

  const totalPages = Math.ceil(sorted.length/PER);
  const paged = sorted.slice((page-1)*PER, page*PER);

  const handleSort = col => {
    if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortCol(col); setSortDir("asc"); }
  };

  const SortIc = ({col}) => (
    <span style={{marginLeft:4,color:sortCol===col?accent:"#3d4451",fontSize:10}}>
      {sortCol===col ? (sortDir==="asc"?"↑":"↓") : "↕"}
    </span>
  );

  const TH = ({label,col,w}) => (
    <th onClick={()=>col&&handleSort(col)} style={{
      padding:"10px 14px",textAlign:"left",fontSize:10.5,fontWeight:600,
      color:"#8b949e",textTransform:"uppercase",letterSpacing:".8px",
      borderBottom:"1px solid #21262d",userSelect:"none",
      cursor:col?"pointer":"default",whiteSpace:"nowrap",width:w
    }}>
      {label}{col&&<SortIc col={col}/>}
    </th>
  );

  if (creating) return <CreateCompany onCancel={()=>setCreating(false)} accent={accent}/>;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden",animation:"fadeIn .2s"}}>

      {/* Top bar */}
      <div style={{
        padding:"22px 28px 16px",flexShrink:0,
        display:"flex",alignItems:"center",justifyContent:"space-between"
      }}>
        <div>
          <div style={{fontSize:11,color:"#8b949e",letterSpacing:".5px",marginBottom:3}}>MASTER PANEL</div>
          <h1 style={{fontSize:22,fontWeight:700,color:"#e6edf3",letterSpacing:"-.3px"}}>Companies</h1>
        </div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          {/* Search */}
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",display:"flex"}}>
              <Ic d={I.search} size={13} color="#6e7681" sw={2}/>
            </span>
            <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}
              placeholder="Search companies…"
              style={{
                background:"#161b22",border:"1px solid #21262d",borderRadius:8,
                color:"#e6edf3",fontSize:13,padding:"8px 12px 8px 30px",
                width:240,outline:"none",transition:"border-color .15s"
              }}
              onFocus={e=>e.target.style.borderColor=accent}
              onBlur={e=>e.target.style.borderColor="#21262d"}
            />
          </div>
          <Btn accent={accent} icon={I.plus} onClick={()=>setCreating(true)}>Add Company</Btn>
        </div>
      </div>

      {/* Stats */}
      <div style={{padding:"0 28px 16px",display:"flex",gap:12,flexShrink:0}}>
        {[
          {label:"Total Companies", value:companies.length,                                 icon:I.grid},
          {label:"Active",          value:companies.filter(c=>c.status==="Active").length,  icon:I.check},
          {label:"Inactive",        value:companies.filter(c=>c.status==="Inactive").length,icon:I.close},
          {label:"Total Employees", value:companies.reduce((s,c)=>s+c.employees,0),         icon:I.users},
        ].map(s=>(
          <div key={s.label} style={{
            background:"#161b22",border:"1px solid #21262d",borderRadius:10,
            padding:"10px 16px",display:"flex",alignItems:"center",gap:10
          }}>
            <div style={{
              width:30,height:30,borderRadius:8,background:`${accent}22`,
              display:"flex",alignItems:"center",justifyContent:"center"
            }}>
              <Ic d={s.icon} size={14} color={accent} sw={2}/>
            </div>
            <div>
              <div style={{fontSize:18,fontWeight:700,color:"#e6edf3"}}>{s.value}</div>
              <div style={{fontSize:10,color:"#8b949e",letterSpacing:".3px"}}>{s.label}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Table */}
      <div style={{flex:1,overflowY:"auto",padding:"0 28px 24px"}}>
        <div style={{background:"#161b22",border:"1px solid #21262d",borderRadius:12,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#0d1117"}}>
                <TH label="Company"      col="name"       w="30%"/>
                <TH label="Code"         col="code"       w="8%"/>
                <TH label="Email"        col="email"      w="22%"/>
                <TH label="Location"     col="city"       w="16%"/>
                <TH label="Emp"          col="employees"  w="5%"/>
                <TH label="Branches"     col="branches"   w="6%"/>
                <TH label="Since"        col="since"      w="9%"/>
                <TH label="Status"       col="status"     w="14%"/>
              </tr>
            </thead>
            <tbody>
              {paged.map(c=>(
                <tr key={c.id}
                  onClick={()=>onSelect(c)}
                  style={{cursor:"pointer",transition:"background .1s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#1c2128"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <Avatar name={c.name} size={30}/>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:500,color:"#e6edf3",
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:220}}>{c.name}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:12,color:"#8b949e",fontFamily:"monospace"}}>{c.code}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:12,color:"#8b949e",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:180}}>{c.email}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:12,color:"#c9d1d9",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:120}}>{c.city}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:13,color:"#e6edf3",textAlign:"center",fontWeight:500}}>{c.employees}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:13,color:"#e6edf3",textAlign:"center",fontWeight:500}}>{c.branches}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d",fontSize:12,color:"#8b949e",whiteSpace:"nowrap"}}>{c.since}</td>
                  <td style={{padding:"13px 14px",borderBottom:"1px solid #21262d"}}><StatusBadge status={c.status}/></td>

                </tr>
              ))}
            </tbody>
          </table>

          {/* Pagination */}
          <div style={{
            padding:"12px 20px",borderTop:"1px solid #21262d",background:"#0d1117",
            display:"flex",alignItems:"center",justifyContent:"space-between"
          }}>
            <span style={{fontSize:12,color:"#8b949e"}}>
              {sorted.length} result{sorted.length!==1?"s":""} · page {page} of {totalPages||1}
            </span>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{
                width:28,height:28,borderRadius:6,background:"#161b22",
                border:"1px solid #21262d",color:page===1?"#3d4451":"#8b949e",
                cursor:page===1?"not-allowed":"pointer",fontSize:13,
                display:"flex",alignItems:"center",justifyContent:"center"
              }}>‹</button>
              {Array.from({length:totalPages||1},(_,i)=>i+1).map(n=>(
                <button key={n} onClick={()=>setPage(n)} style={{
                  width:28,height:28,borderRadius:6,
                  background:page===n?accent:"#161b22",
                  border:`1px solid ${page===n?accent:"#21262d"}`,
                  color:page===n?"#fff":"#8b949e",
                  cursor:"pointer",fontSize:12,fontWeight:page===n?600:400
                }}>{n}</button>
              ))}
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages||totalPages===0} style={{
                width:28,height:28,borderRadius:6,background:"#161b22",
                border:"1px solid #21262d",color:(page===totalPages||totalPages===0)?"#3d4451":"#8b949e",
                cursor:(page===totalPages||totalPages===0)?"not-allowed":"pointer",fontSize:13,
                display:"flex",alignItems:"center",justifyContent:"center"
              }}>›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

                    <Ic d={I.pin} size={10} color="#8b949e" sw={2}/>
                    <span style={{fontSize:11,color:"#8b949e"}}>{b.location}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <Ic d={I.cal} size={10} color="#8b949e" sw={2}/>
                    <span style={{fontSize:11,color:"#8b949e"}}>Since {b.since}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

function SplitView({ companies, initialSelected, onBack, onCreate, accent }) {
  const [selected, setSelected] = useState(initialSelected || companies[0]);
  const [search, setSearch] = useState("");
  const [creating, setCreating] = useState(false);

  const filtered = companies.filter(c=>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.email.toLowerCase().includes(search.toLowerCase())
  );

  const pick = c => { setSelected(c); setCreating(false); localStorage.setItem("mp3_sel",c.id); };

  return (
    <div style={{display:"flex",height:"100%",overflow:"hidden",animation:"fadeIn .18s"}}>
      {/* List panel */}
      <div style={{width:280,flexShrink:0,borderRight:"1px solid #21262d",display:"flex",flexDirection:"column",background:"#161b22"}}>
        {/* Header */}
        <div style={{padding:"16px 16px 12px",borderBottom:"1px solid #21262d",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <button onClick={onBack} style={{
              width:28,height:28,borderRadius:7,border:"1px solid #30363d",
              background:"transparent",color:"#8b949e",cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",
              transition:"all .15s",flexShrink:0
            }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#6e7681";e.currentTarget.style.color="#c9d1d9";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#30363d";e.currentTarget.style.color="#8b949e";}}>
              <Ic d={I.back} size={13} color="currentColor" sw={2}/>
            </button>
            <span style={{fontSize:14,fontWeight:700,color:"#e6edf3",flex:1}}>Companies</span>
            <button onClick={()=>{setCreating(true);setSelected(null);}} style={{
              width:26,height:26,borderRadius:7,background:accent,
              border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"
            }}>
              <Ic d={I.plus} size={14} color="#fff" sw={2.5}/>
            </button>
          </div>
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",display:"flex"}}>
              <Ic d={I.search} size={12} color="#6e7681" sw={2}/>
            </span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
              style={{
                width:"100%",background:"#0d1117",border:"1px solid #21262d",
                borderRadius:7,color:"#e6edf3",fontSize:12,
                padding:"7px 10px 7px 27px",outline:"none",transition:"border-color .15s"
              }}
              onFocus={e=>e.target.style.borderColor=accent}
              onBlur={e=>e.target.style.borderColor="#21262d"}
            />
          </div>
          <div style={{fontSize:10.5,color:"#6e7681",marginTop:7}}>{filtered.length} companies</div>
        </div>
        {/* List */}
        <div style={{flex:1,overflowY:"auto"}}>
          {filtered.map(c=>{
            const active = selected?.id===c.id && !creating;
            return (
              <div key={c.id} onClick={()=>pick(c)} style={{
                padding:"10px 16px",cursor:"pointer",
                borderLeft:active?`3px solid ${accent}`:"3px solid transparent",
                background:active?`${accent}12`:"transparent",
                borderBottom:"1px solid #21262d18",transition:"all .1s"
              }}
              onMouseEnter={e=>{if(!active)e.currentTarget.style.background="#21262d44";}}
              onMouseLeave={e=>{if(!active)e.currentTarget.style.background="transparent";}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <Avatar name={c.name} size={30}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{
                      fontSize:12.5,fontWeight:active?600:400,
                      color:active?"#e6edf3":"#c9d1d9",
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"
                    }}>{c.name}</div>
                    <div style={{fontSize:10.5,color:"#6e7681",marginTop:2}}>
                      {c.employees} emp · {c.branches} branches
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Detail panel */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minWidth:0}}>
        {creating
          ? <CreateCompany onCancel={()=>setCreating(false)} accent={accent}/>
          : selected
            ? <CompanyDetail key={selected.id} company={selected} accent={accent}/>
            : (
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:"#6e7681"}}>
                <Ic d={I.build} size={40} color="#30363d" sw={1.5}/>
                <span style={{fontSize:14}}>Select a company to view details</span>
              </div>
            )
        }
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────
function App() {
  const [view,    setView]    = useState("table"); // "table" | "split"
  const [selected,setSelected]= useState(null);
  const [accent,  setAccent]  = useState(TWEAK_DEFAULTS.accent);

  useEffect(()=>{
    const saved = localStorage.getItem("mp3_view");
    if(saved) setView(saved);
    window.addEventListener("message", e=>{
      if(e.data?.type==="__activate_edit_mode")   document.getElementById("tweaks-panel").classList.add("open");
      if(e.data?.type==="__deactivate_edit_mode") document.getElementById("tweaks-panel").classList.remove("open");
    });
    window.parent.postMessage({type:"__edit_mode_available"},"*");
    document.getElementById("tw-accent").addEventListener("change",e=>{
      setAccent(e.target.value);
      window.parent.postMessage({type:"__edit_mode_set_keys",edits:{accent:e.target.value}},"*");
    });
  },[]);

  const goToDetail = c => {
    setSelected(c);
    setView("split");
    localStorage.setItem("mp3_view","split");
    localStorage.setItem("mp3_sel",c.id);
  };

  const goToTable = () => {
    setView("table");
    localStorage.setItem("mp3_view","table");
  };

  return (
    <div style={{display:"flex",height:"100vh",background:"#0d1117",color:"#e6edf3",overflow:"hidden"}}>
      <NavRail accent={accent}/>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {view==="table"
          ? <TableView
              companies={COMPANIES}
              onSelect={goToDetail}
              onCreate={()=>goToDetail(COMPANIES[0])}
              accent={accent}
            />
          : <SplitView
              companies={COMPANIES}
              initialSelected={selected}
              onBack={goToTable}
              accent={accent}
            />
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
