<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Monthly Attendance Report - Format B</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { font-weight: 500; background: #fff; padding: 0; margin: 0; color: #0f172a; }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .page { box-shadow: none !important; margin: 0 !important; }
    tr { page-break-inside: avoid !important; }
  }

  /* A4 landscape = 297mm × 210mm. Use exact height and strict box-sizing
     so content + padding fits in one page (no phantom blank pages). */
  .page {
    background: #fff;
    width: 297mm;
    height: 210mm;
    box-sizing: border-box;
    margin: 0 auto;
    padding: 10mm 12mm 14mm 12mm;
    page-break-inside: avoid;
    page-break-after: always;
    break-after: page;
    position: relative;
    overflow: hidden;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* Title row */
  .title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .title-row h1 { font-size: 22px; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  .title-row .meta { font-size: 11.5px; color: #334155; margin-top: 4px; font-weight: 500; }
  .title-row .meta .dot { color: #94a3b8; margin: 0 6px; }

  .company-badge {
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 14px 8px 8px;
    display: inline-flex; align-items: center; gap: 10px; background: #fff;
  }
  .company-badge .avatar {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #6d28d9;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; letter-spacing: 0.4px;
  }
  .company-badge .name { font-size: 12px; color: #0f172a; letter-spacing: 0.6px; font-weight: 500; }

  /* Summary row */
  .summary-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-top: 6px; margin-bottom: 10px; }
  .sum-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; background: #fff; }
  .emp-card { display: flex; align-items: center; gap: 12px; }
  .emp-card .photo, .emp-card .photo-fallback {
    width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: #e2e8f0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #475569; font-size: 14px; font-weight: 500;
  }
  .emp-card .name { font-size: 13.5px; color: #0f172a; font-weight: 500; }
  .emp-card .id { font-size: 11px; color: #334155; margin-top: 1px; font-weight: 500; }
  .emp-card .position { font-size: 11px; color: #334155; font-weight: 500; }

  .stat-label { font-size: 10.5px; color: #475569; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }
  .stat-value { margin-top: 6px; font-size: 19px; color: #0f172a; letter-spacing: -0.3px; font-weight: 500; }

  /* Status counters */
  .status-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 16px; }
  .status-cell {
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; background: #fff;
  }
  .status-cell .label { font-size: 10.5px; letter-spacing: 1px; font-weight: 500; }
  .status-cell .count { font-size: 14px; color: #0f172a; letter-spacing: -0.3px; font-weight: 500; }
  .label-present  { color: #16a34a; }
  .label-absent   { color: #dc2626; }
  .label-weekoff  { color: #475569; }
  .label-leave    { color: #ea580c; }
  .label-holiday  { color: #7c3aed; }
  .label-missing  { color: #ea580c; }
  .label-manual   { color: #475569; }

  /* Daily grid */
  .grid-wrap { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  table.daily-grid {
    width: 100%; border-collapse: collapse; font-size: 10.5px; color: #0f172a; background: #fff;
    table-layout: fixed;
  }
  table.daily-grid th, table.daily-grid td {
    border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;
    padding: 7px 4px; text-align: center; vertical-align: middle; white-space: nowrap;
  }
  table.daily-grid th:first-child, table.daily-grid td:first-child {
    text-align: left; background: #f8fafc; color: #334155;
    text-transform: uppercase; letter-spacing: 0.6px; font-size: 10.5px;
    padding-left: 12px; width: 60px; font-weight: 500;
  }
  table.daily-grid thead th { background: #f1f5f9; color: #1e293b; font-size: 11px; letter-spacing: 0.4px; font-weight: 500; }
  table.daily-grid thead .row-days th { background: #f8fafc; color: #334155; font-size: 10px; letter-spacing: 1px; font-weight: 500; }
  table.daily-grid td .time { display: block; font-size: 11px; color: #1e3a8a; font-weight: 500; }
  table.daily-grid td .device { display: block; font-size: 9px; color: #b91c1c; margin-top: 1px; letter-spacing: 0.2px; font-weight: 500; }
  table.daily-grid td.dash { color: #94a3b8; letter-spacing: 1px; font-weight: 500; }
  table.daily-grid td.status { font-size: 12px; letter-spacing: 0.5px; font-weight: 500; }
  td.status.present { color: #16a34a; }
  td.status.absent  { color: #dc2626; }
  td.status.weekoff { color: #ea580c; }
  td.status.holiday { color: #7c3aed; }
  td.status.leave   { color: #f59e0b; }
  td.status.missing { color: #dc2626; }
  td.status.manual  { color: #475569; }
  table.daily-grid .sun { background: #fff7ed; }

  /* Footer */
  .report-footer {
    position: absolute; bottom: 4mm; left: 12mm; right: 12mm;
    padding-top: 6px; border-top: 1px solid #94a3b8;
    font-size: 10.5px; color: #334155;
  }
  .report-footer .legend { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 6px 0; }
  .report-footer .legend span { white-space: nowrap; font-weight: 500; }
  .report-footer .leg-P { color: #16a34a; }
  .report-footer .leg-A { color: #dc2626; }
  .report-footer .leg-W { color: #ea580c; }
  .report-footer .leg-L { color: #f59e0b; }
  .report-footer .leg-H { color: #7c3aed; }
  .report-footer .leg-M { color: #dc2626; }
  .report-footer .footer-row {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid #e2e8f0; padding-top: 6px; margin-top: 4px;
    font-size: 10.5px; color: #475569;
  }
  .error { padding: 40px; text-align: center; color: #b91c1c; font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function() {
  function qs(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function isPlaceholder(v) { return v == null || v === '' || v === '---' || String(v).trim() === '---'; }
  function fmtTime(v) {
    if (isPlaceholder(v)) return '';
    var s = String(v).trim();
    var m = s.match(/^(\d{1,2}):(\d{2})/);
    return m ? pad2(parseInt(m[1],10)) + ':' + m[2] : s;
  }
  function hrsToMin(hhmm) {
    if (isPlaceholder(hhmm)) return 0;
    var p = String(hhmm).split(':');
    if (p.length < 2) return 0;
    return (parseInt(p[0],10) || 0) * 60 + (parseInt(p[1],10) || 0);
  }
  function fmtMin(min) {
    if (!min) return '0h 00m';
    var h = Math.floor(min / 60), m = min % 60;
    return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
  }
  function dayOfWeekShort(d) { return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]; }
  function isSunday(d) { return d.getDay() === 0; }

  function parseDate(raw) {
    if (!raw) return null;
    // try Y-m-d, "01 May 26"
    var d = new Date(raw);
    if (!isNaN(d.getTime())) return d;
    var m = String(raw).match(/^(\d{2})\s+(\w{3})\s+(\d{2,4})$/);
    if (m) {
      var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      var y = parseInt(m[3], 10);
      if (y < 100) y += 2000;
      return new Date(y, months[m[2]] || 0, parseInt(m[1], 10));
    }
    return null;
  }

  // --- URL params ---
  var companyId = qs('company_id');
  var employeeIds = (qs('employee_ids') || '').split(',').filter(Boolean);
  var fromDate = qs('from_date');
  var toDate = qs('to_date');
  var shiftTypeId = parseInt(qs('shift_type_id') || '6', 10);
  var apiBase = qs('api_base') || 'http://127.0.0.1:8000/api';
  var companyName = qs('company_name') || 'Company';
  var statuses = (qs('statuses') || '').split(',').filter(Boolean);

  var payload = {
    page: 1,
    per_page: 10000,
    report_type: 'Monthly',
    shift_type_id: shiftTypeId,
    overtime: 0,
    from_date: fromDate,
    to_date: toDate,
    employee_id: employeeIds.map(function(x) { return parseInt(x, 10) || x; }),
    statuses: statuses,
    department_ids: [],
    showTabs: JSON.stringify({ single: true }),
    company_id: parseInt(companyId, 10),
  };

  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  Promise.all([
    fontsReady,
    fetch(apiBase + '/attendance-report-new', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function(res) {
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }),
  ])
  .then(function(results) {
    var json = results[1];
    var rows = (json && Array.isArray(json.data)) ? json.data : [];
    render(rows);
  })
  .catch(function(err) {
    document.getElementById('root').innerHTML = '<div class="error">Failed to load: ' + esc(err.message) + '</div>';
  });

  function render(rows) {
    // Group by employee
    var groups = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var eid = r.employee_id;
      if (!groups[eid]) groups[eid] = { employee: r.employee, branch: r.branch, rows: [] };
      groups[eid].rows.push(r);
    }

    // Build date list for the period
    var start = parseDate(fromDate);
    var end = parseDate(toDate);
    var dates = [];
    if (start && end) {
      var d = new Date(start.getTime());
      while (d <= end) {
        dates.push(new Date(d.getTime()));
        d.setDate(d.getDate() + 1);
      }
    }
    var half = Math.ceil(dates.length / 2);
    var firstHalf = dates.slice(0, half);
    var secondHalf = dates.slice(half);

    var totalEmp = Object.keys(groups).length;
    var pageNum = 0;
    var html = '';

    Object.keys(groups).forEach(function(eid) {
      pageNum++;
      var g = groups[eid];
      var emp = g.employee || {};
      var branch = g.branch || (emp && emp.branch) || {};
      var byDate = {};
      for (var j = 0; j < g.rows.length; j++) {
        var rr = g.rows[j];
        var pd = parseDate(rr.date);
        if (pd) byDate[pd.toISOString().slice(0, 10)] = rr;
      }

      // Stats
      var stats = { present: 0, absent: 0, late: 0, leave: 0, holiday: 0, weekoff: 0, missing: 0, manual: 0 };
      var totalMin = 0, otMin = 0;
      g.rows.forEach(function(r) {
        var s = r.status;
        if (s === 'P' || s === 'LC' || s === 'EG') stats.present++;
        else if (s === 'A') stats.absent++;
        else if (s === 'L') stats.leave++;
        else if (s === 'H') stats.holiday++;
        else if (s === 'O') stats.weekoff++;
        else if (s === 'M') stats.missing++;
        if (s === 'LC') stats.late++;
        if (s === 'ME' || r.is_manual_entry) stats.manual++;
        totalMin += hrsToMin(r.total_hrs);
        otMin += hrsToMin(r.ot);
      });
      var totalDays = g.rows.length;
      var score = totalDays > 0 ? Math.round((stats.present / totalDays) * 100) : 0;

      var compInitials = String(companyName).replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || 'CO';
      var displayCompany = String(companyName).toUpperCase();
      var empName = (emp.full_name || (emp.first_name || '') + ' ' + (emp.last_name || '')).trim() || '—';
      var empId = emp.employee_id || '—';
      var dept = (emp.department && emp.department.name) || '—';
      var photoSrc = emp.profile_picture && emp.profile_picture !== 'undefined' ? emp.profile_picture : '';

      html += '<div class="page">';
      // Title row
      html += '<div class="title-row">';
      html += '<div><h1>Monthly Attendance Report</h1>';
      html += '<div class="meta">' + esc(fromDate) + ' &mdash; ' + esc(toDate) + '<span class="dot">•</span>Monthly Exact</div></div>';
      html += '<div class="company-badge"><span class="avatar">' + esc(compInitials) + '</span><span class="name">' + esc(displayCompany) + '</span></div>';
      html += '</div>';

      // Summary row
      html += '<div class="summary-row">';
      html += '<div class="sum-card emp-card">';
      if (photoSrc) {
        html += '<img class="photo" src="' + esc(photoSrc) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\';">';
        html += '<span class="photo-fallback" style="display:none;">' + esc(empName.charAt(0)) + '</span>';
      } else {
        html += '<span class="photo-fallback">' + esc(empName.charAt(0)) + '</span>';
      }
      html += '<div><div class="name">' + esc(empName) + '</div><div class="id">ID: ' + esc(empId) + '</div><div class="position">' + esc(dept) + '</div></div>';
      html += '</div>';
      html += '<div class="sum-card"><div class="stat-label">Score</div><div class="stat-value">' + score + '%</div></div>';
      html += '<div class="sum-card"><div class="stat-label">Worked Hours</div><div class="stat-value">' + fmtMin(totalMin) + '</div></div>';
      html += '<div class="sum-card"><div class="stat-label">Overtime</div><div class="stat-value">' + fmtMin(otMin) + '</div></div>';
      html += '</div>';

      // Status counters
      html += '<div class="status-row">';
      html += '<div class="status-cell"><span class="label label-present">PRESENT</span><span class="count">' + pad2(stats.present) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-absent">ABSENT</span><span class="count">' + pad2(stats.absent) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-weekoff">WEEKOFF</span><span class="count">' + pad2(stats.weekoff) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-leave">LEAVE</span><span class="count">' + pad2(stats.leave) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-holiday">HOLIDAY</span><span class="count">' + pad2(stats.holiday) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-missing">MISSING</span><span class="count">' + pad2(stats.missing) + '</span></div>';
      html += '<div class="status-cell"><span class="label label-manual">MANUAL</span><span class="count">' + pad2(stats.manual) + '</span></div>';
      html += '</div>';

      // Daily grids — first half + second half
      html += renderGrid(firstHalf, byDate);
      if (secondHalf.length) html += renderGrid(secondHalf, byDate);

      // Footer
      html += '<div class="report-footer">';
      html += '<div class="legend">';
      html += '<span><span class="leg-P">P</span> = Present,</span>';
      html += '<span><span class="leg-A">A</span> = Absent,</span>';
      html += '<span><span class="leg-W">W</span> = Week Off,</span>';
      html += '<span><span class="leg-L">L</span> = Leaves,</span>';
      html += '<span><span class="leg-H">H</span> = Holiday,</span>';
      html += '<span><span class="leg-M">M</span> = Missed</span>';
      html += '</div>';
      var now = new Date();
      var todayStr = pad2(now.getDate()) + '-' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()] + '-' + now.getFullYear();
      html += '<div class="footer-row">';
      html += '<div>Printed on : ' + todayStr + '</div>';
      html += '<div>Powered by https://mytime2cloud.com</div>';
      html += '<div>Page ' + pageNum + ' of ' + totalEmp + '</div>';
      html += '</div></div>';

      html += '</div>'; // .page
    });

    document.getElementById('root').innerHTML = html;
  }

  function renderGrid(half, byDate) {
    if (!half.length) return '';
    var h = '<div class="grid-wrap"><table class="daily-grid"><thead><tr><th>Dates</th>';
    half.forEach(function(d) { h += '<th class="' + (isSunday(d) ? 'sun' : '') + '">' + pad2(d.getDate()) + '</th>'; });
    h += '</tr><tr class="row-days"><th>Days</th>';
    half.forEach(function(d) { h += '<th class="' + (isSunday(d) ? 'sun' : '') + '">' + dayOfWeekShort(d) + '</th>'; });
    h += '</tr></thead><tbody>';

    function row(label, getter) {
      h += '<tr><td>' + label + '</td>';
      half.forEach(function(d) {
        var key = d.toISOString().slice(0, 10);
        var r = byDate[key];
        var sun = isSunday(d) ? ' sun' : '';
        h += getter(r, sun);
      });
      h += '</tr>';
    }

    row('In', function(r, sun) {
      if (r && !isPlaceholder(r.in)) {
        var dev = r.device_in && r.device_in.name ? r.device_in.name : '';
        return '<td class="' + sun.trim() + '"><span class="time">' + esc(fmtTime(r.in)) + '</span>' + (dev ? '<span class="device">' + esc(dev.slice(0, 8)) + '</span>' : '') + '</td>';
      }
      return '<td class="dash' + sun + '">—</td>';
    });
    row('Out', function(r, sun) {
      if (r && !isPlaceholder(r.out)) {
        var dev = r.device_out && r.device_out.name ? r.device_out.name : '';
        return '<td class="' + sun.trim() + '"><span class="time">' + esc(fmtTime(r.out)) + '</span>' + (dev ? '<span class="device">' + esc(dev.slice(0, 8)) + '</span>' : '') + '</td>';
      }
      return '<td class="dash' + sun + '">—</td>';
    });
    row('OT', function(r, sun) {
      if (r && !isPlaceholder(r.ot) && r.ot !== '00:00') return '<td class="' + sun.trim() + '">' + esc(r.ot) + '</td>';
      return '<td class="dash' + sun + '">—</td>';
    });
    row('T. Hrs', function(r, sun) {
      if (r && !isPlaceholder(r.total_hrs)) return '<td class="' + sun.trim() + '">' + esc(r.total_hrs) + '</td>';
      return '<td class="dash' + sun + '">—</td>';
    });
    row('Status', function(r, sun) {
      var s = r ? r.status : '';
      var cls = 'manual', letter = '—';
      if (s === 'P' || s === 'LC' || s === 'EG' || s === 'ME') { cls = 'present'; letter = 'P'; }
      else if (s === 'A') { cls = 'absent'; letter = 'A'; }
      else if (s === 'O') { cls = 'weekoff'; letter = 'W'; }
      else if (s === 'L') { cls = 'leave'; letter = 'L'; }
      else if (s === 'H') { cls = 'holiday'; letter = 'H'; }
      else if (s === 'M') { cls = 'missing'; letter = 'M'; }
      return '<td class="status ' + cls + sun + '">' + letter + '</td>';
    });

    h += '</tbody></table></div>';
    return h;
  }
})();
</script>
</body>
</html>
