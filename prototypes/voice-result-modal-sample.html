<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTime Assistant — Centered Result Popup (Prototype)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .glass { background: rgba(13, 21, 41, 0.92); backdrop-filter: blur(14px); }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9999px; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.94) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .animate-pop { animation: pop 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes ping2 { 75%, 100% { transform: scale(2); opacity: 0; } }
  </style>
</head>
<body class="bg-slate-950 min-h-screen">
  <!-- Fake dashboard backdrop so the popup has context -->
  <div class="fixed inset-0 bg-gradient-to-br from-slate-900 via-[#0b1020] to-slate-950"></div>
  <div class="fixed inset-0 opacity-[0.04]" style="background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0); background-size: 22px 22px;"></div>

  <!-- Toolbar to switch sample result types -->
  <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] flex gap-1.5 bg-slate-900/80 border border-white/10 rounded-full px-1.5 py-1.5 text-xs">
    <button onclick="show('list')"    class="tab px-3 py-1.5 rounded-full text-slate-300 hover:bg-white/10">Absent list</button>
    <button onclick="show('summary')" class="tab px-3 py-1.5 rounded-full text-slate-300 hover:bg-white/10">Summary</button>
    <button onclick="show('count')"   class="tab px-3 py-1.5 rounded-full text-slate-300 hover:bg-white/10">Count</button>
    <button onclick="show('leave')"   class="tab px-3 py-1.5 rounded-full text-slate-300 hover:bg-white/10">Leave</button>
  </div>

  <!-- ===== Centered Modal ===== -->
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

    <!-- Card -->
    <div class="relative w-full max-w-lg glass border border-white/10 rounded-3xl shadow-2xl shadow-black/60 overflow-hidden animate-pop">
      <!-- Header -->
      <div class="px-5 py-4 border-b border-white/5 flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-500/30 to-purple-600/30 border border-indigo-400/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-indigo-300" style="font-size:20px">graphic_eq</span>
        </div>
        <div class="flex-1 min-w-0">
          <div id="m-label" class="text-base font-bold text-white truncate">Today's Absent List</div>
          <div class="text-[11px] text-slate-400">MyTime Assistant</div>
        </div>
        <button class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition">
          <span class="material-symbols-outlined" style="font-size:20px">close</span>
        </button>
      </div>

      <!-- Spoken summary -->
      <div id="m-speech" class="px-5 pt-4">
        <div class="flex items-start gap-2.5 bg-indigo-500/10 border border-indigo-500/15 rounded-2xl px-4 py-3">
          <span class="material-symbols-outlined text-indigo-300 mt-0.5" style="font-size:18px">volume_up</span>
          <p class="text-sm text-indigo-100/90 leading-relaxed">3 employees are absent today.</p>
        </div>
      </div>

      <!-- Body (results) -->
      <div id="m-body" class="px-5 py-4 max-h-[55vh] overflow-y-auto scroll-thin"></div>

      <!-- Footer -->
      <div class="px-5 py-3.5 border-t border-white/5 bg-white/[0.02] flex items-center justify-between">
        <div class="flex items-center gap-2 text-[11px] text-slate-400">
          <span class="relative flex h-2.5 w-2.5">
            <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400/60" style="animation: ping2 1.4s cubic-bezier(0,0,0.2,1) infinite;"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
          </span>
          Listening for <span class="text-indigo-300 font-semibold">"Hey MyTime"</span>
        </div>
        <button class="flex items-center gap-2 bg-gradient-to-br from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg shadow-indigo-500/30 transition">
          <span class="material-symbols-outlined" style="font-size:16px">mic</span>
          Ask again
        </button>
      </div>
    </div>
  </div>

  <script>
    const C = {
      emerald: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
      red:     "bg-red-500/10 text-red-400 border-red-500/20",
      amber:   "bg-amber-500/10 text-amber-400 border-amber-500/20",
      blue:    "bg-blue-500/10 text-blue-400 border-blue-500/20",
      purple:  "bg-purple-500/10 text-purple-400 border-purple-500/20",
      slate:   "bg-slate-500/10 text-slate-400 border-slate-500/20",
    };

    const employees = [
      { name: "Arun Kumar",   branch: "Chennai HO",  in: "---", out: "---" },
      { name: "Priya S",      branch: "Coimbatore",  in: "---", out: "---" },
      { name: "Mohammed Ali", branch: "Chennai HO",  in: "---", out: "---" },
    ];
    const leaves = [
      { name: "Karthik R", type: "Casual Leave", days: 2, status: "Pending" },
      { name: "Divya N",   type: "Sick Leave",   days: 1, status: "Approved" },
    ];

    function rowList() {
      return `<div class="space-y-2">` + employees.map(e => `
        <div class="flex items-center justify-between px-4 py-3 bg-white/[0.04] hover:bg-white/[0.07] rounded-2xl border border-white/5 transition">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-indigo-500/20 border border-indigo-400/20 flex items-center justify-center text-sm font-bold text-indigo-300">${e.name.charAt(0)}</div>
            <div>
              <div class="text-sm font-medium text-slate-100">${e.name}</div>
              <div class="text-[11px] text-slate-500">${e.branch}</div>
            </div>
          </div>
          <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-red-500/15 text-red-400">ABSENT</span>
        </div>`).join("") + `</div>`;
    }

    function summaryGrid() {
      const cards = [
        ["Present", 142, "emerald"], ["Absent", 3, "red"], ["Late", 8, "amber"],
        ["Leave", 5, "blue"], ["Holiday", 0, "purple"], ["Off", 12, "slate"],
      ];
      return `<div class="grid grid-cols-3 gap-2.5">` + cards.map(([l,v,c]) => `
        <div class="rounded-2xl border p-4 text-center ${C[c]}">
          <div class="text-3xl font-bold">${v}</div>
          <div class="text-[10px] font-semibold uppercase tracking-wider mt-1 opacity-70">${l}</div>
        </div>`).join("") + `</div>`;
    }

    function countBig() {
      return `<div class="text-center py-8">
        <div class="text-6xl font-bold bg-gradient-to-br from-indigo-300 to-purple-400 bg-clip-text text-transparent">214</div>
        <div class="text-sm text-slate-400 mt-2">Total Employees</div>
      </div>`;
    }

    function leaveList() {
      return `<div class="space-y-2">` + leaves.map(l => `
        <div class="flex items-center justify-between px-4 py-3 bg-white/[0.04] rounded-2xl border border-white/5">
          <div>
            <div class="text-sm font-medium text-slate-100">${l.name}</div>
            <div class="text-[11px] text-slate-500">${l.type} &middot; ${l.days} day${l.days>1?'s':''}</div>
          </div>
          <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${l.status==='Approved'?'bg-emerald-500/15 text-emerald-400':'bg-amber-500/15 text-amber-400'}">${l.status}</span>
        </div>`).join("") + `</div>`;
    }

    const VIEWS = {
      list:    { label: "Today's Absent List",   speech: "3 employees are absent today.",            body: rowList },
      summary: { label: "Attendance Summary",      speech: "142 present, 3 absent, 8 late, 5 on leave.", body: summaryGrid },
      count:   { label: "Total Employees",          speech: "There are 214 employees in total.",         body: countBig },
      leave:   { label: "Pending Leave Requests",   speech: "There are 2 pending leave requests.",       body: leaveList },
    };

    function show(key) {
      const v = VIEWS[key];
      document.getElementById("m-label").textContent = v.label;
      document.querySelector("#m-speech p").textContent = v.speech;
      document.getElementById("m-body").innerHTML = v.body();
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("bg-white/10","text-white"));
      event?.target?.classList?.add("bg-white/10","text-white");
    }
    show("list");
  </script>
</body>
</html>
