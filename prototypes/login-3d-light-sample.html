<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTime2Cloud — 3D Login (Light Sample)</title>

  <!-- Tailwind (Play CDN) so classes map 1:1 to the React app later -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for the 3D animated globe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { brand: { DEFAULT: '#3713ec', light: '#5b3ff5', dark: '#2c0fb8' } },
          keyframes: {
            fadeUp: { '0%': { opacity: 0, transform: 'translateY(24px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          },
          animation: { fadeUp: 'fadeUp .8s cubic-bezier(.16,1,.3,1) both' },
        },
      },
    };
  </script>

  <style>
    html, body { height: 100%; }
    /* Light backdrop: soft cool gradient */
    body { font-family: 'Inter', sans-serif; background: linear-gradient(160deg,#f7f9fc 0%,#eaeff7 55%,#e3e9f5 100%); }
    #bg-canvas { position: fixed; inset: 0; z-index: 0; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .15s } .d3 { animation-delay: .25s } .d4 { animation-delay: .35s }
    input::placeholder { color: #94a3b8; }
    input:focus { outline: none; }
  </style>
</head>

<body class="text-slate-900 antialiased overflow-x-hidden">
  <canvas id="bg-canvas"></canvas>

  <!-- soft color halos behind everything (subtle on light) -->
  <div class="pointer-events-none fixed inset-0 z-0">
    <div class="absolute -left-32 top-1/4 h-[480px] w-[480px] rounded-full bg-[#3713ec]/10 blur-[150px]"></div>
    <div class="absolute right-0 bottom-0 h-[420px] w-[420px] rounded-full bg-emerald-400/10 blur-[150px]"></div>
  </div>

  <!-- top bar -->
  <header class="relative z-10 flex items-center justify-between px-6 lg:px-14 py-6">
    <img src="https://mytime2cloud.com/logo22.png" alt="MyTime2Cloud" class="h-9 w-auto object-contain" />
    <div class="flex items-center gap-2">
      <!-- theme toggle: shows Moon (click -> dark) when in light mode -->
      <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition-colors hover:bg-slate-50" aria-label="Switch to dark mode" title="Dark mode">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <!-- language -->
      <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 shadow-sm transition-colors hover:bg-slate-50" aria-label="Change language" title="Language">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      </button>
    </div>
  </header>

  <!-- main -->
  <main class="relative z-10 mx-auto flex min-h-[calc(100vh-96px)] max-w-[88rem] flex-col lg:flex-row items-center justify-center gap-10 lg:gap-8 px-6 lg:px-14">

    <!-- left: branding over the 3D globe -->
    <section class="hidden lg:flex flex-1 flex-col justify-center">
      <div class="animate-fadeUp d1 inline-flex w-fit items-center gap-2 rounded-full border border-emerald-300/60 bg-emerald-50 px-4 py-2 text-xs font-bold uppercase tracking-[0.2em] text-emerald-700">
        <span class="h-2 w-2 animate-pulse rounded-full bg-emerald-500"></span>
        Enterprise Intelligence
      </div>
      <h1 class="animate-fadeUp d2 mt-6 max-w-[630px] text-[4.875rem] font-bold leading-[1.02] text-slate-900">
        Your workforce, fully <span class="text-emerald-600">in sync</span> across the cloud.
      </h1>
      <p class="animate-fadeUp d3 mt-7 max-w-2xl text-xl leading-relaxed text-slate-600">
        Attendance, shifts, leave and payroll — orchestrated in real time from a single intelligent platform.
      </p>
      <div class="animate-fadeUp d4 mt-10 flex items-center gap-10 text-slate-500">
        <div><div class="text-3xl font-extrabold text-slate-900">99.9%</div><div class="text-xs uppercase tracking-widest">Uptime</div></div>
        <div class="h-10 w-px bg-slate-300"></div>
        <div><div class="text-3xl font-extrabold text-slate-900">24/7</div><div class="text-xs uppercase tracking-widest">Live sync</div></div>
        <div class="h-10 w-px bg-slate-300"></div>
        <div><div class="text-3xl font-extrabold text-slate-900">10k+</div><div class="text-xs uppercase tracking-widest">Teams</div></div>
      </div>
    </section>

    <!-- right: login card -->
    <section class="w-full max-w-[500px]">
      <div class="animate-fadeUp d3 rounded-3xl border border-slate-200 bg-white p-10 sm:p-12 shadow-[0_24px_70px_-20px_rgba(15,23,42,0.25)]">
        <h2 class="text-3xl font-bold text-slate-900">Welcome back</h2>
        <p class="mt-1.5 text-base text-slate-500">Sign in to your workspace to continue.</p>

        <form class="mt-9 flex flex-col gap-6" onsubmit="event.preventDefault()">
          <!-- role selector -->
          <div>
            <label class="mb-2 block text-xs font-bold uppercase tracking-[0.15em] text-slate-500">Access level</label>
            <div class="grid grid-cols-3 gap-1 rounded-xl border border-slate-200 bg-slate-100 p-1" id="roles">
              <button type="button" class="role-btn flex items-center justify-center gap-1.5 rounded-lg py-2.5 text-sm font-semibold transition-all">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Admin
              </button>
              <button type="button" class="role-btn flex items-center justify-center gap-1.5 rounded-lg py-2.5 text-sm font-semibold transition-all">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Manager
              </button>
              <button type="button" class="role-btn flex items-center justify-center gap-1.5 rounded-lg py-2.5 text-sm font-semibold transition-all">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                Staff
              </button>
            </div>
          </div>

          <!-- email -->
          <div>
            <label class="mb-1.5 block text-base font-semibold text-slate-700">Email</label>
            <div class="group relative">
              <svg class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
              <input type="text" value="demo@gmail.com" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-4 text-base text-slate-900 transition-all focus:border-brand/50 focus:ring-2 focus:ring-brand/20" placeholder="you@company.com" />
            </div>
          </div>

          <!-- password -->
          <div>
            <label class="mb-1.5 block text-base font-semibold text-slate-700">Password</label>
            <div class="group relative">
              <svg class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" value="demo" class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-12 text-base text-slate-900 transition-all focus:border-brand/50 focus:ring-2 focus:ring-brand/20" placeholder="••••••••" />
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- remember / forgot -->
          <div class="flex items-center justify-between">
            <label class="flex cursor-pointer items-center gap-2">
              <input type="checkbox" checked class="h-5 w-5 rounded border-slate-300 bg-white text-brand focus:ring-brand/20" />
              <span class="select-none text-sm font-medium text-slate-600">Remember me</span>
            </label>
            <a href="#" class="text-sm font-semibold text-brand hover:text-brand-dark">Forgot password?</a>
          </div>

          <!-- submit -->
          <button type="submit" class="group mt-1 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-brand text-base font-bold text-white shadow-lg shadow-brand/30 transition-all hover:bg-brand-dark active:scale-[0.98]">
            <span>Sign in</span>
            <svg class="h-5 w-5 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // role selector active state
    const roleBtns=[...document.querySelectorAll('.role-btn')];
    function setRole(el){
      roleBtns.forEach(b=>{ b.classList.remove('bg-brand','text-white','shadow'); b.classList.add('text-slate-500'); });
      el.classList.add('bg-brand','text-white','shadow'); el.classList.remove('text-slate-500');
    }
    roleBtns.forEach(b=>b.addEventListener('click',()=>setRole(b)));
    setRole(roleBtns[0]);

    /* ---------- Three.js animated globe — LIGHT MODE variant ---------- */
    (function(){
      const canvas=document.getElementById('bg-canvas');
      const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      renderer.setSize(window.innerWidth,window.innerHeight);

      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,2000);
      camera.position.z=420;

      // soft round sprite (white falloff; tinted by vertex/material color)
      function dot(){
        const c=document.createElement('canvas'); c.width=c.height=64;
        const g=c.getContext('2d'); const grd=g.createRadialGradient(32,32,0,32,32,32);
        grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(.35,'rgba(255,255,255,.85)');
        grd.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=grd; g.fillRect(0,0,64,64);
        return new THREE.CanvasTexture(c);
      }
      const sprite=dot();
      const group=new THREE.Group(); scene.add(group);

      // globe surface points — darker indigo↔emerald so they read on a light bg (NORMAL blending)
      const R=150, N=1100;
      const pos=new Float32Array(N*3), col=new Float32Array(N*3);
      const cA=new THREE.Color('#10b981'), cB=new THREE.Color('#4f46e5');
      for(let i=0;i<N;i++){
        const phi=Math.acos(1-2*(i+0.5)/N);
        const theta=Math.PI*(1+Math.sqrt(5))*i;
        const x=R*Math.sin(phi)*Math.cos(theta), y=R*Math.cos(phi), z=R*Math.sin(phi)*Math.sin(theta);
        pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
        const c=cA.clone().lerp(cB,(y+R)/(2*R));
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
      const gGeo=new THREE.BufferGeometry();
      gGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      gGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
      const gMat=new THREE.PointsMaterial({size:5,map:sprite,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false,blending:THREE.NormalBlending});
      group.add(new THREE.Points(gGeo,gMat));

      // wireframe globe shell — faint indigo lines
      group.add(new THREE.LineSegments(
        new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(R,3)),
        new THREE.LineBasicMaterial({color:0x6366f1,transparent:true,opacity:0.16})
      ));
      // counter-rotating inner core — faint emerald
      const core=new THREE.LineSegments(
        new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(R*0.55,1)),
        new THREE.LineBasicMaterial({color:0x10b981,transparent:true,opacity:0.22})
      );
      group.add(core);

      // ambient particle field — soft indigo, normal blending
      const M=600, fpos=new Float32Array(M*3);
      for(let i=0;i<M;i++){ fpos[i*3]=(Math.random()-0.5)*1600; fpos[i*3+1]=(Math.random()-0.5)*1200; fpos[i*3+2]=(Math.random()-0.5)*900; }
      const fGeo=new THREE.BufferGeometry(); fGeo.setAttribute('position',new THREE.BufferAttribute(fpos,3));
      const field=new THREE.Points(fGeo,new THREE.PointsMaterial({size:3,map:sprite,color:0x6366f1,transparent:true,opacity:0.35,depthWrite:false,blending:THREE.NormalBlending}));
      scene.add(field);

      group.position.x=-90;
      let mx=0,my=0;
      window.addEventListener('mousemove',e=>{ mx=(e.clientX/window.innerWidth-0.5); my=(e.clientY/window.innerHeight-0.5); });
      function resize(){
        camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
        group.position.x = window.innerWidth < 1024 ? 0 : -90;
      }
      window.addEventListener('resize',resize); resize();

      const clock=new THREE.Clock();
      (function loop(){
        requestAnimationFrame(loop);
        const t=clock.getElapsedTime();
        group.rotation.y = t*0.12 + mx*0.6;
        group.rotation.x = Math.sin(t*0.15)*0.08 - my*0.4;
        core.rotation.y = -t*0.25; core.rotation.x = t*0.18;
        field.rotation.y = t*0.02;
        camera.position.x += ( mx*40 - camera.position.x )*0.04;
        camera.position.y += ( -my*40 - camera.position.y )*0.04;
        camera.lookAt(0,0,0);
        renderer.render(scene,camera);
      })();
    })();
  </script>
</body>
</html>
