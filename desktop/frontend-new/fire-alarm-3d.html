<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fire Alarm — 3D Animated Popup</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1100px 700px at 50% 115%, oklch(0.55 0.2 38 / .45), transparent 60%),
      radial-gradient(1200px 600px at 50% -10%, oklch(0.18 0.03 264) 0%, oklch(0.08 0.02 264) 55%, oklch(0.05 0.02 30) 100%);
    color:oklch(0.984 0.003 248);
  }

  /* ---- full fire background (wall of flames across the bottom) ---- */
  .scene-fire{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:0;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .scene-fire img{height:100%;flex:1 1 0;min-width:0;object-fit:cover;mix-blend-mode:screen;
    filter:saturate(1.15) blur(.5px);opacity:.92;transform-origin:bottom center;
    animation:sceneFlick 1.6s ease-in-out infinite}
  .scene-fire img:nth-child(2){transform:scaleX(-1);animation-duration:1.9s;animation-delay:.25s}
  .scene-fire img:nth-child(3){animation-duration:1.4s;animation-delay:.5s}
  .scene-fire img:nth-child(4){transform:scaleX(-1);animation-duration:2.1s;animation-delay:.15s}
  @keyframes sceneFlick{
    0%,100%{opacity:.9;transform:translateY(0) scaleY(1)}
    50%{opacity:1;transform:translateY(-6px) scaleY(1.04)}
  }
  .scene-fire:nth-child(2) img:nth-child(2){transform:scaleX(-1) translateY(-6px)}
  /* heat haze / glow overlay above the flames so the card stays readable */
  .scene-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(800px 600px at 50% 45%, oklch(0.1 0.02 264 / .55), transparent 70%)}
  .mono{font-family:ui-monospace,"JetBrains Mono",monospace}
  .muted{color:oklch(0.704 0.04 257)}

  /* floating ambient embers in the backdrop */
  .bg-embers{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .bg-embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
    background:oklch(0.8 0.18 50);box-shadow:0 0 8px oklch(0.75 0.22 45);opacity:0;
    animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(1)}
    10%{opacity:.9}
    100%{opacity:0;transform:translateY(-105vh) translateX(40px) scale(.2)}
  }

  /* ---- 3D stage ---- */
  .stage{position:relative;z-index:2;perspective:1400px;perspective-origin:50% 40%}

  .card3d{
    position:relative;width:480px;border-radius:22px;
    transform-style:preserve-3d;
    transform:rotateX(8deg) rotateY(-10deg);
    animation:floatIn 900ms cubic-bezier(.16,1,.3,1) both, bob 6s ease-in-out 900ms infinite;
    transition:transform .15s ease-out;
    will-change:transform;
  }
  @keyframes floatIn{
    0%{opacity:0;transform:rotateX(35deg) rotateY(-22deg) translateZ(-260px) scale(.9)}
    100%{opacity:1;transform:rotateX(8deg) rotateY(-10deg) translateZ(0) scale(1)}
  }
  @keyframes bob{
    0%,100%{transform:rotateX(8deg) rotateY(-10deg) translateY(0)}
    50%    {transform:rotateX(6deg) rotateY(-7deg) translateY(-10px)}
  }

  /* steady warm glow behind the card (soft pulse, no rotation) */
  .card3d::before{
    content:"";position:absolute;inset:-3px;border-radius:25px;z-index:0;
    background:radial-gradient(120% 120% at 50% 50%, oklch(0.66 0.22 32 / .9), oklch(0.55 0.2 20 / .55) 55%, transparent 80%);
    filter:blur(18px);transform:translateZ(-30px);
    animation:glowPulse 2.8s ease-in-out infinite;
  }
  @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:.9}}

  .surface{
    position:relative;z-index:1;border-radius:22px;overflow:hidden;transform-style:preserve-3d;
    background:linear-gradient(180deg, oklch(0.2 0.03 260 / .80), oklch(0.14 0.03 262 / .86));
    backdrop-filter:blur(22px) saturate(1.25);
    -webkit-backdrop-filter:blur(22px) saturate(1.25);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 40px 90px -28px rgba(0,0,0,.92),
               inset 0 1px 0 rgba(255,255,255,.12),
               inset 0 0 60px -20px oklch(0.62 0.22 25 / .25);
  }
  /* soft light streak across the top of the glass */
  .surface::before{content:"";position:absolute;top:0;left:0;right:0;height:40%;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.07), transparent)}

  /* ---- header (floats forward) ---- */
  .header{
    position:relative;display:flex;align-items:center;justify-content:space-between;padding:15px 22px;color:#fff;
    background:linear-gradient(110deg,oklch(0.55 0.22 25) 0%,oklch(0.64 0.24 32) 50%,oklch(0.56 0.23 18) 100%);
    background-size:200% 200%;animation:bar 4s ease-in-out infinite;
    transform:translateZ(40px);
  }
  @keyframes bar{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .header .title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .pill{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.22);padding:4px 10px;border-radius:999px}
  .pill i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite;box-shadow:0 0 6px #fff}
  .pill b{font-size:10px;font-weight:800;letter-spacing:.14em}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  .body{padding:24px 22px 16px;transform-style:preserve-3d}
  .row{display:flex;gap:18px;align-items:center}

  /* ---- fire tile (pops out the most) ---- */
  .fire-tile{
    position:relative;flex-shrink:0;height:104px;width:104px;border-radius:20px;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;
    background:radial-gradient(circle at 50% 92%, oklch(0.5 0.2 38 / .85), oklch(0.12 0.04 30 / .98) 70%);
    border:1px solid oklch(0.66 0.22 30 / .55);
    box-shadow:
      inset 0 -22px 44px -10px oklch(0.72 0.24 38 / .6),
      0 18px 40px -12px oklch(0.62 0.22 25 / .8),
      0 0 0 1px rgba(255,255,255,.04);
    transform:translateZ(70px);
  }
  .fire-img{height:135%;width:auto;object-fit:contain;mix-blend-mode:screen;
    animation:flicker 1.3s ease-in-out infinite;filter:drop-shadow(0 0 16px oklch(0.72 0.24 38 / .95))}
  @keyframes flicker{
    0%,100%{opacity:1;transform:scale(1) translateY(0);filter:drop-shadow(0 0 16px oklch(0.72 0.24 38 /.95))}
    50%{opacity:.93;transform:scale(1.05) translateY(-2px);filter:drop-shadow(0 0 28px oklch(0.78 0.24 48 /1))}
  }
  /* embers rising out of the tile */
  .tile-embers{position:absolute;inset:0;pointer-events:none}
  .tile-embers i{position:absolute;bottom:18px;width:3px;height:3px;border-radius:50%;
    background:oklch(0.85 0.16 60);box-shadow:0 0 6px oklch(0.78 0.22 50);opacity:0;animation:rise ease-in infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px) translateX(10px) scale(.2)}}

  .meta{flex:1;min-width:0;transform:translateZ(30px)}
  .trig{display:flex;align-items:center;gap:6px;font-size:12px}
  .name{margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;
    background:linear-gradient(180deg,#fff,oklch(0.85 0.02 250));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:5px;font-size:12px}

  /* detail stat tiles — fill the full width, no dead space */
  .stats{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform:translateZ(18px)}
  .stat{display:flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:13px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:oklch(0.704 0.04 257)}
  .stat .v{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .actions{margin-top:18px;transform:translateZ(50px)}
  .btn{position:relative;overflow:hidden;border:none;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:15px 22px;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:.01em;color:#fff;
    background:linear-gradient(135deg,oklch(0.7 0.23 34),oklch(0.55 0.22 16));
    box-shadow:0 16px 38px -10px oklch(0.62 0.22 25 / .85),inset 0 1px 0 oklch(1 0 0 /.35);
    transition:transform .15s ease,filter .2s ease}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn .shine{position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
  .btn:hover .shine{animation:shine .7s ease}
  @keyframes shine{to{transform:translateX(100%)}}

  .footer{padding:16px 22px;border-top:1px solid rgba(255,255,255,.06);background:oklch(0.24 0.03 260 / .6);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;transform:translateZ(20px)}
  .chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;
    background:color-mix(in oklab,oklch(0.72 0.17 160) 12%,transparent);
    border:1px solid color-mix(in oklab,oklch(0.72 0.17 160) 32%,transparent);color:oklch(0.74 0.17 160)}
  .chip .cdot{display:flex;align-items:center;justify-content:center;height:16px;width:16px;border-radius:50%;
    background:color-mix(in oklab,oklch(0.72 0.17 160) 26%,transparent)}
  .chip b{font-size:12px;font-weight:600}

  /* floor reflection glow */
  .card3d::after{content:"";position:absolute;left:8%;right:8%;bottom:-46px;height:60px;border-radius:50%;
    background:radial-gradient(closest-side, oklch(0.62 0.22 25 / .55), transparent 75%);
    filter:blur(10px);transform:translateZ(-40px) rotateX(80deg);animation:bob 6s ease-in-out 900ms infinite}

  @media (prefers-reduced-motion: reduce){
    .card3d,.card3d::before,.card3d::after,.header,.fire-img,.bg-embers i,.tile-embers i,.pill i{animation:none}
    .card3d{transform:rotateX(6deg) rotateY(-8deg)}
  }
</style>
</head>
<body>
  <!-- fire wall background -->
  <div class="scene-fire">
    <img src="public/real-fire.png" alt="" />
    <img src="public/real-fire.png" alt="" />
    <img src="public/real-fire.png" alt="" />
    <img src="public/real-fire.png" alt="" />
  </div>
  <div class="scene-glow"></div>
  <div class="bg-embers" id="bgEmbers"></div>

  <div class="stage">
    <div class="card3d" id="card">
      <div class="surface">
        <!-- Header -->
        <div class="header">
          <div class="title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            Fire Alarm Notification
          </div>
          <div class="pill"><i></i><b>ACTIVE</b></div>
        </div>

        <!-- Body -->
        <div class="body">
          <div class="row">
            <div class="fire-tile">
              <img class="fire-img" src="public/real-fire.png" alt="" />
              <div class="tile-embers" id="tileEmbers"></div>
            </div>
            <div class="meta">
              <div class="trig muted">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Triggered at 15:06 · Mon, Jun 01 2026</span>
              </div>
              <div class="name">test222</div>
              <div class="sub muted">Access control device · alarm active</div>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><span class="k">Branch</span><span class="v">test1</span></div>
            <div class="stat"><span class="k">Location</span><span class="v">—</span></div>
            <div class="stat"><span class="k">Serial</span><span class="v mono">SN-00A21B</span></div>
          </div>

          <div class="actions">
            <button class="btn">
              <span class="shine"></span>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
              Turn Off Alarm
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <div class="chip">
            <span class="cdot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <b>All branch doors opened</b>
          </div>
          <p class="muted" style="font-size:11px">Turn off the alarm on each device to close this popup.</p>
        </div>
      </div>
    </div>
  </div>

<script>
  // rising embers inside the fire tile
  const te = document.getElementById('tileEmbers');
  for(let i=0;i<7;i++){
    const e=document.createElement('i');
    e.style.left=(15+Math.random()*70)+'%';
    e.style.animationDuration=(1.6+Math.random()*1.8)+'s';
    e.style.animationDelay=(Math.random()*2)+'s';
    te.appendChild(e);
  }
  // ambient backdrop embers
  const bg=document.getElementById('bgEmbers');
  for(let i=0;i<22;i++){
    const e=document.createElement('i');
    e.style.left=(Math.random()*100)+'%';
    e.style.animationDuration=(6+Math.random()*8)+'s';
    e.style.animationDelay=(Math.random()*8)+'s';
    e.style.transform='scale('+(0.5+Math.random())+')';
    bg.appendChild(e);
  }
  // mouse-tracking 3D tilt (parallax)
  const card=document.getElementById('card');
  const stage=document.querySelector('.stage');
  let raf;
  stage.addEventListener('mousemove',(ev)=>{
    const r=stage.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width-0.5;
    const py=(ev.clientY-r.top)/r.height-0.5;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      card.style.animation='none';
      card.style.transform=`rotateX(${(-py*16+6).toFixed(2)}deg) rotateY(${(px*20).toFixed(2)}deg)`;
    });
  });
  stage.addEventListener('mouseleave',()=>{
    card.style.transform='rotateX(8deg) rotateY(-10deg)';
  });
</script>
</body>
</html>
