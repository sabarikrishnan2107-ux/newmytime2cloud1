<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Access Control Log Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; padding: 0; }
  body { font-weight: 500; background: #f1f5f9; color: #0f172a; }

  /* A4 LANDSCAPE — 297mm × 210mm. */
  @page { size: 297mm 210mm; margin: 0; }
  @page :first { size: 297mm 210mm; margin: 0; }

  @media print {
    html, body { background: #fff !important; width: 297mm; height: 210mm; }
    body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .page {
      box-shadow: none !important;
      margin: 0 !important;
      width: 297mm !important;
      height: 210mm !important;
      page-break-after: always;
      page-break-inside: avoid;
      break-after: page;
      break-inside: avoid;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    tr { page-break-inside: avoid !important; }
  }

  .page {
    background: #fff;
    width: 297mm;
    height: 210mm;
    box-sizing: border-box;
    margin: 12px auto;
    padding: 10mm 12mm 18mm 12mm;
    page-break-inside: avoid;
    page-break-after: always;
    break-after: page;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* ---------- Title row ---------- */
  .title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .title-row h1 { font-size: 22px; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  .title-row .meta { font-size: 11.5px; color: #334155; margin-top: 4px; font-weight: 500; }
  .title-row .meta .dot { color: #94a3b8; margin: 0 6px; }

  .company-badge {
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 14px 8px 8px;
    display: inline-flex; align-items: center; gap: 10px; background: #fff;
  }
  .company-badge .avatar {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #6d28d9;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; letter-spacing: 0.4px;
  }
  .company-badge .name { font-size: 12px; color: #0f172a; letter-spacing: 0.6px; font-weight: 500; }
  .company-badge .sub  { font-size: 10px; color: #64748b; margin-top: 2px; font-weight: 500; letter-spacing: 0.3px; }

  .ribbon {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f1f5f9; color: #475569; font-size: 9.5px; font-weight: 500;
    padding: 2px 9px; border-radius: 999px; letter-spacing: 0.6px;
    margin-top: 3px;
  }
  .ribbon .dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }

  /* ---------- Summary cards ---------- */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
  .sum-card {
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 11px 14px;
    background: #fff; position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 12px;
  }
  .sum-card .icon-bubble {
    width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; letter-spacing: -0.2px;
  }
  .sum-card .icon-bubble svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .sum-card .stat-body { flex: 1; min-width: 0; }
  .sum-card .stat-label { font-size: 10px; color: #475569; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; }
  .sum-card .stat-value { margin-top: 3px; font-size: 19px; color: #0f172a; letter-spacing: -0.3px; font-weight: 500; }
  .sum-card .stat-sub   { margin-top: 1px; font-size: 10px; color: #64748b; font-weight: 500; }
  .icon-bubble.b-slate  { background: #f1f5f9; color: #475569; }
  .icon-bubble.b-blue   { background: #dbeafe; color: #1d4ed8; }
  .icon-bubble.b-green  { background: #dcfce7; color: #15803d; }
  .icon-bubble.b-violet { background: #ede9fe; color: #6d28d9; }
  .icon-bubble.b-red    { background: #fee2e2; color: #b91c1c; }

  /* ---------- Date section header ---------- */
  .date-section {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; margin-top: 6px; margin-bottom: 4px;
  }
  .date-section .label { font-size: 12.5px; color: #0f172a; font-weight: 500; letter-spacing: 0.3px; }
  .date-section .label .dow {
    display: inline-block; margin-left: 8px;
    padding: 2px 9px; border-radius: 999px;
    background: #ede9fe; color: #6d28d9;
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  /* Day-specific tints */
  .date-section .label .dow.dow-sun { background: #fee2e2; color: #b91c1c; } /* Sunday — red */
  .date-section .label .dow.dow-sat { background: #ffedd5; color: #c2410c; } /* Saturday — orange */
  .date-section .meta { font-size: 10.5px; color: #64748b; font-weight: 500; }
  .date-section .meta .pill-mini {
    display: inline-block; padding: 2px 8px; border-radius: 999px; margin-left: 4px;
    background: #ecfeff; color: #0e7490; border: 1px solid #cffafe;
    font-size: 10px; font-weight: 500;
  }

  /* ---------- Table ---------- */
  .grid-wrap { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
  table.acl-tbl {
    width: 100%; border-collapse: collapse; font-size: 11px; color: #0f172a; background: #fff;
    table-layout: fixed;
  }
  table.acl-tbl th, table.acl-tbl td {
    border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;
    padding: 5px 9px; text-align: left; vertical-align: middle;
  }
  table.acl-tbl thead th {
    background: #f1f5f9; color: #1e293b; font-size: 10.5px;
    letter-spacing: 0.6px; text-transform: uppercase; font-weight: 500;
  }
  table.acl-tbl tbody tr:nth-child(even) { background: #fafbfc; }
  table.acl-tbl td.center { text-align: center; }

  /* Time cell */
  .time-cell { font-family: "SF Mono", "Monaco", "Cascadia Mono", "Consolas", monospace; font-size: 11.5px; font-weight: 500; color: #0f172a; letter-spacing: -0.2px; }

  /* Employee cell */
  .emp-cell { display: flex; align-items: center; gap: 8px; }
  .emp-cell .photo, .emp-cell .photo-fallback {
    width: 26px; height: 26px; border-radius: 7px; object-fit: cover; background: #e2e8f0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #475569; font-size: 10px; font-weight: 500; flex-shrink: 0;
  }
  .emp-cell .photo-fallback.c1 { background: #dbeafe; color: #1d4ed8; }
  .emp-cell .photo-fallback.c2 { background: #fce7f3; color: #be185d; }
  .emp-cell .photo-fallback.c3 { background: #dcfce7; color: #15803d; }
  .emp-cell .photo-fallback.c4 { background: #fef3c7; color: #b45309; }
  .emp-cell .photo-fallback.c5 { background: #ede9fe; color: #6d28d9; }
  .emp-cell .photo-fallback.c6 { background: #fee2e2; color: #b91c1c; }
  .emp-cell .name { font-size: 11.5px; color: #0f172a; font-weight: 500; line-height: 1.25; }
  .emp-cell .id   { font-size: 10px; color: #64748b; font-weight: 500; }

  /* Branch / dept */
  .branch-cell .br   { font-size: 11px; color: #0f172a; font-weight: 500; line-height: 1.3; }
  .branch-cell .dept { font-size: 10px; color: #64748b; font-weight: 500; }

  /* Device cell */
  .device-cell .dev   { font-size: 11px; color: #0f172a; font-weight: 500; line-height: 1.3; }
  .device-cell .door  { font-size: 9.5px; color: #64748b; font-weight: 500; letter-spacing: 0.3px; margin-top: 1px; }

  /* Direction pill */
  .dir-pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px; min-width: 42px; text-align: center;
  }
  .dir-in    { background: #dcfce7; color: #15803d; }
  .dir-out   { background: #dbeafe; color: #1d4ed8; }

  /* Mode chip with SVG icon */
  .mode-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; color: #0f172a; font-weight: 500;
  }
  .mode-chip .ic {
    width: 22px; height: 22px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 500;
  }
  .mode-chip .ic svg {
    width: 13px; height: 13px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .mode-chip .ic.m-card   { background: #ede9fe; color: #6d28d9; }
  .mode-chip .ic.m-face   { background: #dbeafe; color: #1d4ed8; }
  .mode-chip .ic.m-finger { background: #ffedd5; color: #c2410c; }
  .mode-chip .ic.m-pin    { background: #f1f5f9; color: #475569; }
  .mode-chip .ic.m-mobile { background: #dcfce7; color: #15803d; }

  /* Shift cell — plain text, color-coded by shift family */
  .shift-cell {
    display: inline-block;
    font-size: 11px; font-weight: 500; letter-spacing: 0.2px;
  }
  .sh-multi   { color: #6d28d9; } /* Multi / Auto / Split — multi-session */
  .sh-single  { color: #1d4ed8; } /* FILO / Single Shift */
  .sh-night   { color: #c2410c; } /* Night Shift */
  .sh-default { color: #475569; }

  /* Footer */
  .report-footer {
    position: absolute; bottom: 4mm; left: 12mm; right: 12mm;
    padding-top: 6px; border-top: 1px solid #94a3b8;
    font-size: 10.5px; color: #334155;
  }
  .report-footer .legend { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 6px 0; }
  .report-footer .legend span { white-space: nowrap; font-weight: 500; }
  .leg-in      { color: #15803d; }
  .leg-out     { color: #1d4ed8; }
  .leg-present { color: #15803d; }
  .leg-absent  { color: #b91c1c; }
  .leg-manual  { color: #92400e; }
  .leg-missing { color: #c2410c; }
  .leg-card    { color: #6d28d9; }
  .leg-face    { color: #1d4ed8; }
  .leg-finger  { color: #c2410c; }
  .leg-pin     { color: #475569; }
  .leg-mobile  { color: #15803d; }
  .report-footer .footer-row {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid #e2e8f0; padding-top: 6px; margin-top: 4px;
    font-size: 10.5px; color: #475569;
  }

  /* Loading / error states */
  .state {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; text-align: center;
    font-size: 13px; color: #64748b; font-weight: 500;
  }
  .state .err { color: #b91c1c; }
</style>
</head>
<body>

<div id="root">
  <div class="state">Loading Access Control Log Report…</div>
</div>

<script>
(function() {
  // ---------- Helpers ----------
  function qs(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW_LONG     = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function parseDate(raw) {
    if (!raw) return null;
    var m = String(raw).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
    var d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDateLong(d) {
    return pad(d.getDate()) + ' ' + MONTHS_LONG[d.getMonth()] + ' ' + d.getFullYear();
  }
  function fmtDateShort(d) {
    return pad(d.getDate()) + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }
  function dowLong(d) { return DOW_LONG[d.getDay()]; }

  function fmtTime(t) {
    if (!t) return '—';
    var s = String(t).trim();
    var m = s.match(/^(\d{1,2}):(\d{2})(:\d{2})?/);
    if (m) return pad(parseInt(m[1],10)) + ':' + m[2] + (m[3] || ':00');
    return s;
  }

  // ---------- Shift label mapping ----------
  // Maps the employee's shift_type_id to the canonical attendance label.
  var SHIFT_LABELS = {
    1: 'FILO',
    2: 'Multi In/Out',
    3: 'Auto Shift',
    4: 'Night Shift',
    5: 'Split Duty',
    6: 'Single Shift'
  };
  function shiftMeta(l) {
    var id = getShiftTypeId(l);
    var n = typeof id === 'string' ? parseInt(id, 10) : id;
    var label = SHIFT_LABELS[n] || (l && l.employee && l.employee.shift && (l.employee.shift.name || l.employee.shift.shift_name)) || '—';
    var cls = 'sh-default';
    if (n === 2 || n === 3 || n === 5) cls = 'sh-multi';
    else if (n === 1 || n === 6) cls = 'sh-single';
    else if (n === 4) cls = 'sh-night';
    return { label: label, cls: cls };
  }

  // ---------- Mode mapping ----------
  // SVG icons (lucide-style stroked) for biometric / credential modes.
  var MODE_ICONS = {
    face:    '<svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
    finger:  '<svg viewBox="0 0 24 24"><path d="M12 11c0 5 3 7 3 9"/><path d="M9 11c0 4 2 6 2 9"/><path d="M15 11c0 4-1 7-2 9"/><path d="M18 11c0 5-2 9-3 11"/><path d="M6 11c0 3 1 5 1 8"/><path d="M3 11a9 9 0 0 1 18 0"/><path d="M3 14a9 9 0 0 0 1 4"/></svg>',
    card:    '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
    pin:     '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4"/><path d="M18 5l3 3"/><path d="M15 8l3 3"/></svg>',
    mobile:  '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
    qr:      '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="17"/><line x1="14" y1="20" x2="14" y2="21"/><line x1="17" y1="14" x2="17" y2="15"/><line x1="20" y1="14" x2="21" y2="14"/><line x1="17" y1="17" x2="17" y2="21"/><line x1="21" y1="17" x2="21" y2="21"/><line x1="20" y1="20" x2="20" y2="21"/></svg>'
  };

  function modeMeta(raw) {
    var m = String(raw == null ? '' : raw).toLowerCase();
    if (m.indexOf('mobile') >= 0 || m.indexOf('phone') >= 0 || m.indexOf('app') >= 0) return { icon: 'mobile', cls: 'm-mobile', label: 'Mobile' };
    if (m.indexOf('face')   >= 0) return { icon: 'face',   cls: 'm-face',   label: 'Face' };
    if (m.indexOf('finger') >= 0) return { icon: 'finger', cls: 'm-finger', label: 'Fingerprint' };
    if (m.indexOf('card')   >= 0 || m.indexOf('rfid') >= 0) return { icon: 'card', cls: 'm-card', label: 'Card' };
    if (m.indexOf('pin')    >= 0 || m.indexOf('password') >= 0) return { icon: 'pin', cls: 'm-pin', label: 'PIN' };
    if (m.indexOf('qr')     >= 0) return { icon: 'qr',  cls: 'm-pin', label: 'QR' };
    return { icon: 'face', cls: 'm-face', label: raw || 'Face' };
  }

  // ---------- Direction (IN/OUT) ----------
  // Resolve the device's reported direction (null if unknown).
  function isOut(l) {
    var f = String((l && l.device && l.device.function) || '').toLowerCase();
    var t = String(l && (l.log_type || l.LogType) || '').toLowerCase();
    if (f === 'out' || t === 'out') return true;
    if (f === 'in'  || t === 'in')  return false;
    var dev = String((l && (l.DeviceID || l.device_id || (l.device && l.device.device_id))) || '').toLowerCase();
    if (dev.indexOf('out') >= 0) return true;
    if (dev.indexOf('in')  >= 0) return false;
    return null;
  }

  // Multi (2), Auto (3) and Split (5) shifts allow multiple in/out
  // sessions per day → ignore device direction, alternate IN/OUT by
  // punch time (matches attendance pairing).
  // Single (6), FILO (1), Night (4) are single-session → trust the
  // device's direction so duplicate punches stay as the device reported
  // (e.g. a night-shift employee clocking out multiple times shows all
  // those as OUT, not alternating IN/OUT).
  function getShiftTypeId(l) {
    var emp = l && l.employee;
    if (!emp) return null;
    if (emp.schedule && emp.schedule.shift_type_id != null) return emp.schedule.shift_type_id;
    if (emp.shift_type_id != null) return emp.shift_type_id;
    if (l && l.shift_type_id != null) return l.shift_type_id;
    return null;
  }
  function isMultiSessionShift(l) {
    var id = getShiftTypeId(l);
    var n = typeof id === 'string' ? parseInt(id, 10) : id;
    return n === 2 || n === 3 || n === 5;
  }

  function classifyLogs(logs) {
    // Phase 1: Multi/Auto/Split → null (will alternate). Others → device.
    var enriched = logs.map(function(l) {
      return Object.assign({}, l, {
        _isOut: isMultiSessionShift(l) ? null : isOut(l)
      });
    });

    // Phase 2: alternate IN/OUT for unresolved logs per (employee, date).
    var groups = {};
    for (var i = 0; i < enriched.length; i++) {
      var l = enriched[i];
      if (l._isOut !== null) continue;
      var empKey = (l.employee && (l.employee.id || l.employee.employee_id || l.employee.system_user_id)) || '?';
      var dt = l.date || (l.LogTime ? String(l.LogTime).slice(0,10) : '');
      var k = empKey + '|' + dt;
      if (!groups[k]) groups[k] = [];
      groups[k].push(l);
    }
    Object.keys(groups).forEach(function(k) {
      var list = groups[k];
      list.sort(function(a, b) {
        var ta = (a.date || '') + ' ' + (a.time || '');
        var tb = (b.date || '') + ' ' + (b.time || '');
        return ta < tb ? -1 : ta > tb ? 1 : 0;
      });
      list.forEach(function(l, idx) { l._isOut = idx % 2 === 1; });
    });

    // Phase 3: any still-null logs default to IN.
    enriched.forEach(function(l) { if (l._isOut === null) l._isOut = false; });
    return enriched;
  }

  // ---------- Employee initials → color class ----------
  function initialsOf(name) {
    var parts = String(name || '').trim().split(/\s+/);
    return (parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '');
  }
  function colorFor(key) {
    var s = String(key || ''); var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 'c' + (Math.abs(h) % 6 + 1);
  }

  // ---------- Peak hour for a date ----------
  function peakHour(logs) {
    var counts = {};
    for (var i = 0; i < logs.length; i++) {
      var t = String(logs[i].time || '').slice(0,2);
      if (!t) continue;
      counts[t] = (counts[t] || 0) + 1;
    }
    var topH = null, topC = 0;
    Object.keys(counts).forEach(function(h) {
      if (counts[h] > topC) { topC = counts[h]; topH = h; }
    });
    if (topH === null) return '';
    var nextH = pad((parseInt(topH,10) + 1) % 24);
    return topH + ':00–' + nextH + ':00';
  }

  // ---------- URL params ----------
  var apiBase     = qs('api_base') || 'http://127.0.0.1:8000/api';
  var companyId   = qs('company_id');
  var companyName = qs('company_name') || 'Company';
  var fromDate    = qs('from_date');
  var toDate      = qs('to_date');
  var branchId    = qs('branch_id');
  var branchName  = qs('branch_name');
  var deviceId    = qs('device_id');
  var deviceName  = qs('device_name');
  var employeeId  = qs('employee_id');
  var employeeName= qs('employee_name');
  var userType    = qs('user_type');
  var timeFrom    = qs('time_from'); // "HH:MM"
  var timeTo      = qs('time_to');   // "HH:MM"

  // ---------- Fetch ----------
  var queryParts = [];
  function addParam(k, v) { if (v !== '' && v != null) queryParts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v)); }
  addParam('company_id', companyId);
  addParam('from_date', fromDate);
  addParam('to_date', toDate);
  addParam('branch_id', branchId);
  addParam('DeviceID', deviceId);
  addParam('UserID', employeeId);
  addParam('user_type', userType);
  addParam('per_page', 5000);
  addParam('page', 1);
  addParam('sortDesc', 'false');
  addParam('include_device_types[]', 'all');
  addParam('include_device_types[]', 'Access Control');

  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.all([
    fontsReady,
    fetch(apiBase + '/access_control_report?' + queryParts.join('&'), {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      credentials: 'include'
    }).then(function(res) {
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    })
  ]).then(function(results) {
    var json = results[1];
    var rows = (json && Array.isArray(json.data)) ? json.data : (Array.isArray(json) ? json : []);
    render(rows);
  }).catch(function(err) {
    document.getElementById('root').innerHTML =
      '<div class="state"><div><div class="err">Failed to load report</div><div style="margin-top:6px;font-size:11.5px;">' + esc(err.message) + '</div></div></div>';
  });

  // ---------- Render ----------
  function render(rawRows) {
    // Optional time-of-day window filter (HH:MM, inclusive).
    if (timeFrom || timeTo) {
      var lo = timeFrom || '00:00';
      var hi = timeTo   || '23:59';
      rawRows = rawRows.filter(function(l) {
        var t = String((l && l.time) || '').match(/^(\d{1,2}):(\d{2})/);
        if (!t) return false;
        var hhmm = (t[1].length === 1 ? '0' + t[1] : t[1]) + ':' + t[2];
        return hhmm >= lo && hhmm <= hi;
      });
    }
    // Classify direction
    var rows = classifyLogs(rawRows);

    // Sort by date+time ascending
    rows.sort(function(a, b) {
      var ta = (a.date || '') + ' ' + (a.time || '');
      var tb = (b.date || '') + ' ' + (b.time || '');
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    });

    // Group by date (preserving order)
    var dateOrder = [];
    var byDate = {};
    for (var i = 0; i < rows.length; i++) {
      var d = rows[i].date || (rows[i].LogTime ? String(rows[i].LogTime).slice(0,10) : 'unknown');
      if (!byDate[d]) { byDate[d] = []; dateOrder.push(d); }
      byDate[d].push(rows[i]);
    }

    // Stats
    var totalEvents = rows.length;
    var empSet = {}, devSet = {};
    var missingCount = 0, manualCount = 0;
    for (var j = 0; j < rows.length; j++) {
      var l = rows[j];
      var ek = l.employee && (l.employee.id || l.employee.employee_id || l.employee.system_user_id);
      var dk = l.device && (l.device.device_id || l.device.id);
      if (ek != null) empSet[ek] = 1;
      if (dk != null) devSet[dk] = 1;
      var stRaw = String((l && l.status) == null ? '' : l.status).trim().toUpperCase();
      if (stRaw === 'M' || stRaw === 'MISSING') missingCount++;
      if (stRaw === 'ME' || stRaw === 'MA' || stRaw === 'MN' || stRaw === 'MANUAL') manualCount++;
    }
    var stats = {
      totalEvents: totalEvents,
      uniqueEmployees: Object.keys(empSet).length,
      uniqueDevices: Object.keys(devSet).length,
      missingPlusManual: missingCount + manualCount,
      missingCount: missingCount,
      manualCount: manualCount
    };

    // ---------- Pagination ----------
    // Per-page capacity. The numbers below include one slot for the date
    // section header, so visible log rows are (capacity − 1) per page.
    //   First page  →  9 visible log rows  ( 9 + 1 date header = 10)
    //   Continuation → 11 visible log rows (11 + 1 date header = 12)
    var ROWS_PER_FIRST = 10;
    var ROWS_PER_REST  = 12;

    // Pages: array of { dateSection: {...}, rows: [...] }[]
    // Each "block" within a page is one date section + the rows on that page for that date.
    // We greedily fill pages.
    var pages = [];
    var currentPage = { blocks: [], rowCount: 0, isFirst: true };
    function pageCap(p) { return p.isFirst ? ROWS_PER_FIRST : ROWS_PER_REST; }
    function newPage() {
      if (currentPage.blocks.length > 0) pages.push(currentPage);
      currentPage = { blocks: [], rowCount: 0, isFirst: false };
    }

    for (var d = 0; d < dateOrder.length; d++) {
      var dateKey = dateOrder[d];
      var dayLogs = byDate[dateKey];
      var dateObj = parseDate(dateKey);
      var dateMeta = {
        key: dateKey,
        label: dateObj ? fmtDateLong(dateObj) : dateKey,
        dow: dateObj ? dowLong(dateObj) : '',
        count: dayLogs.length,
        uniqueEmps: (function() {
          var s = {};
          dayLogs.forEach(function(l) {
            var ek = l.employee && (l.employee.id || l.employee.employee_id || l.employee.system_user_id);
            if (ek != null) s[ek] = 1;
          });
          return Object.keys(s).length;
        })(),
        peak: peakHour(dayLogs)
      };

      var idx = 0;
      while (idx < dayLogs.length) {
        var cap = pageCap(currentPage);
        var remaining = cap - currentPage.rowCount;
        // Need at least 1 row + a date section header (~1 row slot) for a fresh section
        if (remaining < 2) { newPage(); continue; }
        // Allocate as many rows as fit (reserve 1 slot for the date section header)
        var canFit = Math.min(dayLogs.length - idx, remaining - 1);
        currentPage.blocks.push({
          dateMeta: dateMeta,
          rows: dayLogs.slice(idx, idx + canFit),
          isContinuation: idx > 0
        });
        currentPage.rowCount += canFit + 1; // +1 for the date section row
        idx += canFit;
        if (idx < dayLogs.length) newPage(); // current page is full mid-date
      }
    }
    if (currentPage.blocks.length > 0) pages.push(currentPage);
    if (pages.length === 0) {
      pages.push({ blocks: [], rowCount: 0, isFirst: true });
    }

    // ---------- Build HTML ----------
    var html = '';
    pages.forEach(function(page, pIdx) {
      html += renderPage(page, pIdx + 1, pages.length, stats, totalEvents);
    });

    document.getElementById('root').innerHTML = html || '<div class="state">No access events found for the selected filters.</div>';
  }

  // ---------- Render a single page ----------
  function renderPage(page, pageNum, totalPages, stats, totalEvents) {
    var compInitials = String(companyName).replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || 'CO';
    var companyDisplay = String(companyName).toUpperCase();

    // Date range header
    var fromD = parseDate(fromDate), toD = parseDate(toDate);
    var rangeLabel = '';
    if (fromD && toD) {
      rangeLabel = fmtDateLong(fromD) + (fromDate === toDate ? '' : ' – ' + fmtDateLong(toD));
    } else if (fromDate) {
      rangeLabel = fromDate;
    }

    var filterBits = [];
    filterBits.push(branchName || (branchId ? 'Branch ' + branchId : 'All Branches'));
    filterBits.push(deviceName || (deviceId ? 'Device ' + deviceId : 'All Devices'));
    if (employeeName) filterBits.push(employeeName);
    if (userType) filterBits.push(userType);
    if (timeFrom || timeTo) {
      filterBits.push('Time ' + (timeFrom || '00:00') + '–' + (timeTo || '23:59'));
    }

    var h = '';
    h += '<div class="page">';

    // ---- Title row ----
    h += '<div class="title-row">';
    h += '  <div>';
    h += '    <h1>Access Control Log Report</h1>';
    h += '    <div class="meta">' + esc(rangeLabel);
    filterBits.forEach(function(b) { h += '<span class="dot">•</span>' + esc(b); });
    h += '<span class="dot">•</span>Generated ' + esc(new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })) + '</div>';
    if (page.isFirst) {
      h += '    <div class="ribbon"><span class="dot"></span>' + Number(stats.totalEvents).toLocaleString() + ' ACCESS EVENTS · ' +
            stats.uniqueEmployees + ' EMPLOYEES · ' + stats.uniqueDevices + ' DEVICES</div>';
    }
    h += '  </div>';
    h += '  <div class="company-badge">';
    h += '    <div class="avatar">' + esc(compInitials) + '</div>';
    h += '    <div>';
    h += '      <div class="name">' + esc(companyDisplay) + '</div>';
    if (branchName) h += '      <div class="sub">' + esc(branchName) + '</div>';
    h += '    </div>';
    h += '  </div>';
    h += '</div>';

    // ---- Summary cards (only on first page) ----
    if (page.isFirst) {
      h += '<div class="summary-row">';
      h += sumCard('b-slate',  'events',    'Total Events',     Number(stats.totalEvents).toLocaleString(), '');
      h += sumCard('b-blue',   'employees', 'Total Employees',  String(stats.uniqueEmployees), '');
      h += sumCard('b-violet', 'devices',   'Total Devices',    String(stats.uniqueDevices),   '');
      h += sumCard('b-red',    'alert',     'Missing / Manual',
        '<span style="color:#b91c1c;">' + stats.missingPlusManual + '</span> <span style="font-size:13px;color:#94a3b8;font-weight:500;">/ ' + Number(stats.totalEvents).toLocaleString() + '</span>',
        stats.missingCount + ' missing · ' + stats.manualCount + ' manual');
      h += '</div>';
    }

    // ---- Blocks ----
    page.blocks.forEach(function(block) {
      h += renderBlock(block);
    });

    if (page.blocks.length === 0) {
      h += '<div class="state">No access events for the selected filters.</div>';
    }

    // ---- Footer ----
    h += '<div class="report-footer">';
    h += '  <div class="legend">';
    h += '    <span class="leg-in">● IN</span>';
    h += '    <span class="leg-out">● OUT</span>';
    h += '    <span class="leg-card">● Card</span>';
    h += '    <span class="leg-face">● Face</span>';
    h += '    <span class="leg-finger">● Fingerprint</span>';
    h += '    <span class="leg-pin">● PIN</span>';
    h += '    <span class="leg-mobile">● Mobile</span>';
    h += '  </div>';
    h += '  <div class="footer-row">';
    h += '    <div>' + esc(stats.totalEvents) + ' total events · Generated by MyTime2Cloud</div>';
    h += '    <div>Page ' + pageNum + ' of ' + totalPages + ' · Access Control Log Report</div>';
    h += '  </div>';
    h += '</div>';

    h += '</div>';
    return h;
  }

  // SVG icon library (lucide-style stroked icons rendered inline).
  var ICONS = {
    events:    '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/></svg>',
    employees: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    devices:   '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
    alert:     '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };

  function sumCard(bubbleCls, iconKey, label, value, sub) {
    var iconHtml = ICONS[iconKey] || '';
    return [
      '<div class="sum-card">',
      '  <div class="icon-bubble ' + bubbleCls + '">' + iconHtml + '</div>',
      '  <div class="stat-body">',
      '    <div class="stat-label">' + esc(label) + '</div>',
      '    <div class="stat-value">' + value + '</div>',
      sub ? '    <div class="stat-sub">' + esc(sub) + '</div>' : '',
      '  </div>',
      '</div>'
    ].join('');
  }

  function renderBlock(block) {
    var dm = block.dateMeta;
    var continuation = block.isContinuation ? ' <span style="font-size:9.5px;color:#64748b;font-weight:500;margin-left:6px;">(continued)</span>' : '';
    var peakPill = dm.peak ? ' <span class="pill-mini">Peak: ' + esc(dm.peak) + '</span>' : '';

    var dowExtra = '';
    if (dm.dow === 'Sunday') dowExtra = ' dow-sun';
    else if (dm.dow === 'Saturday') dowExtra = ' dow-sat';

    var h = '';
    h += '<div class="date-section">';
    h += '  <div class="label">' + esc(dm.label) + '<span class="dow' + dowExtra + '">' + esc(dm.dow) + '</span>' + continuation + '</div>';
    h += '  <div class="meta">' + dm.count + ' events · ' + dm.uniqueEmps + ' unique employees' + peakPill + '</div>';
    h += '</div>';

    h += '<div class="grid-wrap"><table class="acl-tbl">';
    h += '  <colgroup>';
    h += '    <col style="width:9%" />';
    h += '    <col style="width:18%" />';
    h += '    <col style="width:13%" />';
    h += '    <col style="width:17%" />';
    h += '    <col style="width:9%" />';
    h += '    <col style="width:13%" />';
    h += '    <col style="width:11%" />';
    h += '    <col style="width:10%" />';
    h += '  </colgroup>';
    h += '  <thead><tr>';
    h += '    <th>Time</th><th>Employee</th><th>Branch / Dept</th><th>Device / Door</th>';
    h += '    <th class="center">Direction</th><th>Mode</th><th>Shift</th><th>User Type</th>';
    h += '  </tr></thead>';
    h += '  <tbody>';
    block.rows.forEach(function(l) {
      h += renderRow(l);
    });
    h += '  </tbody></table></div>';
    return h;
  }

  function renderRow(l) {
    var emp = l.employee || {};
    var name = emp.full_name || ((emp.first_name || '') + ' ' + (emp.last_name || '')).trim() || '—';
    var empId = emp.employee_id || '—';
    var devId = emp.system_user_id != null ? emp.system_user_id : (l.UserID != null ? l.UserID : '');
    var idLine = empId + (devId !== '' && devId != null ? ' · DEV-' + devId : '');
    var branchName = (emp.branch && emp.branch.branch_name) || '—';
    var deptName   = (emp.department && emp.department.name) || (emp.designation && emp.designation.title) || '—';
    var devName    = (l.device && l.device.name) || '—';
    var isOutVal   = !!l._isOut;
    var mode       = modeMeta(l.mode);
    var shift      = shiftMeta(l);
    var photoSrc   = emp.profile_picture && emp.profile_picture !== 'undefined' ? emp.profile_picture : '';
    var color      = colorFor(emp.id || emp.employee_id || empId);
    var initials   = (initialsOf(name) || '?').toUpperCase();
    var userTypeLabel = l.user_type || 'Employee';

    var h = '<tr>';
    h += '<td><span class="time-cell">' + esc(fmtTime(l.time)) + '</span></td>';
    h += '<td><div class="emp-cell">';
    if (photoSrc) {
      h += '<img class="photo" src="' + esc(photoSrc) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling && (this.nextElementSibling.style.display=\'inline-flex\');" />';
    }
    h += '<div class="photo-fallback ' + color + '"' + (photoSrc ? ' style="display:none"' : '') + '>' + esc(initials) + '</div>';
    h += '<div><div class="name">' + esc(name) + '</div><div class="id">' + esc(idLine) + '</div></div>';
    h += '</div></td>';
    h += '<td class="branch-cell"><div class="br">' + esc(branchName) + '</div><div class="dept">' + esc(deptName) + '</div></td>';
    h += '<td class="device-cell"><div class="dev">' + esc(devName) + '</div></td>';
    h += '<td class="center"><span class="dir-pill ' + (isOutVal ? 'dir-out' : 'dir-in') + '">' + (isOutVal ? 'OUT' : 'IN') + '</span></td>';
    h += '<td><span class="mode-chip"><span class="ic ' + mode.cls + '">' + (MODE_ICONS[mode.icon] || '') + '</span>' + esc(mode.label) + '</span></td>';
    h += '<td><span class="shift-cell ' + shift.cls + '">' + esc(shift.label) + '</span></td>';
    h += '<td>' + esc(userTypeLabel) + '</td>';
    h += '</tr>';
    return h;
  }
})();
</script>
