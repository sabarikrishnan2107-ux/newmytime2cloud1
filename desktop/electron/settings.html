<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>MyTime2Cloud — Settings</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #0b1220; color: #e6edf6; padding: 24px; }
    h1 { font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: #93a4bd; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; font-size: 12px; color: #6b7c96; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #8aa0bd; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #243049; background: #111a2b; color: #e6edf6; font-size: 13px; outline: none; }
    input:focus { border-color: #4f7cff; }
    .full { grid-column: 1 / -1; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
    button { padding: 10px 16px; border-radius: 8px; border: 0; font-size: 13px; font-weight: 700; cursor: pointer; }
    .primary { background: #4f7cff; color: #fff; }
    .ghost { background: transparent; color: #93a4bd; border: 1px solid #243049; }
    .test { background: #16324a; color: #cfe6ff; }
    .spacer { flex: 1; }
    #status { margin-top: 16px; font-size: 12px; min-height: 18px; }
    .ok { color: #34d399; } .err { color: #f87171; } .muted { color: #6b7c96; }
    .warn { margin-top: 14px; font-size: 11px; color: #fbbf24; }
  </style>
</head>
<body>
  <h1>Database Connection</h1>
  <p class="sub">Where the desktop app stores and reads its data. Saving restarts the app to apply.</p>

  <div class="grid">
    <div class="full">
      <label for="host">Host</label>
      <input id="host" placeholder="127.0.0.1" autocomplete="off" />
    </div>
    <div>
      <label for="port">Port</label>
      <input id="port" type="number" placeholder="5432" />
    </div>
    <div>
      <label for="database">Database</label>
      <input id="database" placeholder="mytime2cloud-desktop-v2" autocomplete="off" />
    </div>
    <div>
      <label for="username">Username</label>
      <input id="username" placeholder="postgres" autocomplete="off" />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off" />
    </div>
  </div>

  <div class="warn" id="warn" style="display:none">⚠ This is the LIVE production database. The desktop build must stay local.</div>

  <div class="row">
    <button class="test" id="btnTest">Test connection</button>
    <div class="spacer"></div>
    <button class="ghost" id="btnCancel">Cancel</button>
    <button class="primary" id="btnSave">Save &amp; Restart</button>
  </div>

  <div id="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ["host", "port", "database", "username", "password"];
    const LIVE = "139.59.69.241";

    function read() {
      return {
        host: $("host").value.trim(),
        port: Number($("port").value) || 5432,
        database: $("database").value.trim(),
        username: $("username").value.trim(),
        password: $("password").value,
      };
    }
    function setStatus(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }
    function checkLive() { $("warn").style.display = $("host").value.trim() === LIVE ? "block" : "none"; }

    (async () => {
      const cfg = await window.m2c.getConfig();
      const db = cfg.db || {};
      $("host").value = db.host || "";
      $("port").value = db.port || "";
      $("database").value = db.database || "";
      $("username").value = db.username || "";
      $("password").value = db.password || "";
      checkLive();
    })();

    $("host").addEventListener("input", checkLive);

    $("btnTest").addEventListener("click", async () => {
      setStatus("Testing…", "muted");
      const r = await window.m2c.testDb(read());
      setStatus(r.ok ? "✓ " + r.message : "✗ " + r.message, r.ok ? "ok" : "err");
    });

    $("btnCancel").addEventListener("click", () => window.m2c.close());

    $("btnSave").addEventListener("click", async () => {
      const db = read();
      if (db.host === LIVE) {
        setStatus("✗ Refusing to save: 139.59.69.241 is the live production DB.", "err");
        return;
      }
      setStatus("Testing before save…", "muted");
      const t = await window.m2c.testDb(db);
      if (!t.ok) { setStatus("✗ Not saved — connection failed: " + t.message, "err"); return; }
      setStatus("Saving and restarting…", "muted");
      await window.m2c.saveDb(db);
    });
  </script>
</body>
</html>
