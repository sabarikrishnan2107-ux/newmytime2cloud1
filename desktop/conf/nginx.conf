# MyTime2Cloud desktop — nginx front door.
# Spawned by electron/main.js with `-p <repo root>`, so every relative path
# below (root, logs, temp, includes) resolves under the repo root regardless of
# where the app is installed — no machine-specific paths.
#
#   :8000  Laravel API + media   -> backend/public/index.php via php-cgi pool
#   :3001  Next.js static export -> frontend-new/out, with the __M2C_HOST__
#          token rewritten per-request to the host the client used.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  logs/access.log;
    error_log   logs/error.log;

    # Keep all scratch dirs under temp/ so the repo root stays clean (gitignored).
    client_body_temp_path temp/client_body;
    fastcgi_temp_path     temp/fastcgi;
    proxy_temp_path       temp/proxy;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 100M;   # photo / bulk-import uploads

    # PHP-CGI worker pool — round-robin. Each php-cgi -b instance is
    # single-request on Windows, so the pool provides concurrency.
    # Keep these ports in sync with PHP_PORTS in electron/main.js.
    upstream php_workers {
        server 127.0.0.1:9000;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
    }

    # ── Laravel API (system of record) + media ──────────────────────────────
    server {
        listen      8000;
        server_name _;
        root        backend/public;
        index       index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include      fastcgi_params;
            fastcgi_pass php_workers;
            fastcgi_index index.php;
            # $realpath_root => absolute, symlink-resolved path, so SCRIPT_FILENAME
            # is correct no matter what cwd php-cgi was started in.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 300;   # long report generation
        }

        location ~ /\.ht { deny all; }
    }

    # ── Next.js static export (the web UI) ───────────────────────────────────
    server {
        listen      3001;
        server_name _;
        root        frontend-new/out;
        index       index.html;

        # The production build bakes the literal host token __M2C_HOST__ into
        # every service URL (see frontend-new/.env.production.local). Rewrite it
        # to the host the client actually used ($host = Host header minus port),
        # so the desktop needs no static IP and no rebuild when the LAN IP changes.
        # Applies to all response types (the token lives in .js/.json, not just html).
        sub_filter_once  off;
        sub_filter_types *;
        sub_filter        __M2C_HOST__ $host;

        # trailingSlash export: /login/ -> /login/index.html. Fall back to .html
        # and finally the root document for client-routed paths.
        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ~ /\.ht { deny all; }
    }
}
